<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daylight Blocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: widget-style color blocks on a cool off-white ground. One saturated "Now" block per screen,
   soft-tinted area tiles, white working cards; color does the separating, borders stay out of the way. */
:root {
  --ground:#EDF1F5; --surface:#FFFFFF; --surface-2:#F1F4F8; --line:#DCE2E9;
  --ink:#0F1720; --ink-2:#435061; --ink-3:#5B6777;
  --scrim:rgba(12,18,26,.42); --nav-bg:rgba(255,255,255,.92);
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 28px rgba(16,24,40,.07);
  --track:rgba(15,23,32,.10);
  --todo:#6A43E8; --on-todo:#FFFFFF; --todo-soft:#ECE6FF; --todo-ink:#5330C4;
  --gym:#FF5A2B; --on-gym:#1F0A02; --gym-soft:#FFE6DC; --gym-ink:#B3370E;
  --school:#1F5AE0; --on-school:#FFFFFF; --school-soft:#E0E8FF; --school-ink:#1C48B8;
  --food:#9BD23A; --on-food:#142200; --food-soft:#EAF6D3; --food-ink:#3F640A; --food-ring:#6BA514;
  --water:#13B3C6; --on-water:#002A30; --water-soft:#D4F2F5; --water-ink:#08707F;
  --amber:#FFB21E; --on-amber:#2A1A00;
  --focus:#1F5AE0;
  --f-display:"Bricolage Grotesque", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --r-xl:30px; --r-l:24px; --r-m:18px; --r-s:12px;
  --nav-h:68px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:#0D1116; --surface:#171D25; --surface-2:#1F2630; --line:#2A333E;
    --ink:#EFF3F7; --ink-2:#B4BECB; --ink-3:#97A2B1;
    --scrim:rgba(0,0,0,.6); --nav-bg:rgba(23,29,37,.94);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.28);
    --track:rgba(239,243,247,.13);
    --todo:#7B57FF; --on-todo:#FFFFFF; --todo-soft:#251D47; --todo-ink:#BBA8FF;
    --gym:#FF6A3D; --on-gym:#1F0A02; --gym-soft:#3A1E14; --gym-ink:#FFA07F;
    --school:#3566F0; --on-school:#FFFFFF; --school-soft:#18244A; --school-ink:#A3BAFF;
    --food:#A6DC45; --on-food:#142200; --food-soft:#212E10; --food-ink:#C3E987; --food-ring:#A6DC45;
    --water:#1CC3D6; --on-water:#002A30; --water-soft:#0F2F35; --water-ink:#7ADFEA;
    --amber:#FFB82E; --on-amber:#2A1A00;
    --focus:#9DB5FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --ground:#0D1116; --surface:#171D25; --surface-2:#1F2630; --line:#2A333E;
  --ink:#EFF3F7; --ink-2:#B4BECB; --ink-3:#97A2B1;
  --scrim:rgba(0,0,0,.6); --nav-bg:rgba(23,29,37,.94);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.28);
  --track:rgba(239,243,247,.13);
  --todo:#7B57FF; --on-todo:#FFFFFF; --todo-soft:#251D47; --todo-ink:#BBA8FF;
  --gym:#FF6A3D; --on-gym:#1F0A02; --gym-soft:#3A1E14; --gym-ink:#FFA07F;
  --school:#3566F0; --on-school:#FFFFFF; --school-soft:#18244A; --school-ink:#A3BAFF;
  --food:#A6DC45; --on-food:#142200; --food-soft:#212E10; --food-ink:#C3E987; --food-ring:#A6DC45;
  --water:#1CC3D6; --on-water:#002A30; --water-soft:#0F2F35; --water-ink:#7ADFEA;
  --amber:#FFB82E; --on-amber:#2A1A00;
  --focus:#9DB5FF;
  color-scheme:dark;
}

*, *::before, *::after { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; background:var(--ground); }
body {
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
[hidden] { display:none !important; }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:0; padding:0; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
h1, h2, h3, p { margin:0; }
h1, h2, h3 { font-family:var(--f-display); text-wrap:balance; letter-spacing:-.01em; }
ul { list-style:none; margin:0; padding:0; }
:focus { outline:none; }
:focus-visible { outline:3px solid var(--focus); outline-offset:2px; border-radius:10px; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.num { font-family:var(--f-display); font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
svg.i { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
svg.i.sm { width:18px; height:18px; }
svg.i.xs { width:15px; height:15px; stroke-width:2.4; }

/* ---------- App shell ---------- */
.app { min-height:100vh; min-height:100dvh; }
.views {
  max-width:1120px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:calc(env(safe-area-inset-top, 0px) + 12px);
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
}
.view { display:flex; flex-direction:column; gap:16px; }
.view.col { max-width:640px; margin:0 auto; }
.stack { display:flex; flex-direction:column; gap:12px; }

/* ---------- Bottom nav ---------- */
.tabs {
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--nav-bg); -webkit-backdrop-filter:saturate(1.4) blur(14px); backdrop-filter:saturate(1.4) blur(14px);
  box-shadow:0 -1px 0 var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  padding-left:max(8px, env(safe-area-inset-left, 0px));
  padding-right:max(8px, env(safe-area-inset-right, 0px));
}
.tabs-in { display:grid; grid-template-columns:repeat(4, 1fr); max-width:520px; margin:0 auto; height:var(--nav-h); }
.tab {
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  min-height:44px; color:var(--ink-3); font-size:13px; font-weight:600; letter-spacing:.01em;
}
.tab .tab-ic { display:grid; place-items:center; width:56px; height:32px; border-radius:999px; transition:background-color .2s, color .2s; }
.tab[aria-current="page"] { color:var(--ink); }
.tab[data-view="today"][aria-current="page"] .tab-ic { background:var(--todo-soft); color:var(--todo-ink); }
.tab[data-view="gym"][aria-current="page"] .tab-ic { background:var(--gym-soft); color:var(--gym-ink); }
.tab[data-view="school"][aria-current="page"] .tab-ic { background:var(--school-soft); color:var(--school-ink); }
.tab[data-view="food"][aria-current="page"] .tab-ic { background:var(--food-soft); color:var(--food-ink); }

/* ---------- Headers ---------- */
.top { display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"date actions" "greet greet"; align-items:center; column-gap:12px; }
.top .date { grid-area:date; font-size:14px; font-weight:600; color:var(--ink-2); letter-spacing:.01em; }
.top .actions { grid-area:actions; display:flex; align-items:center; gap:6px; }
.top h1 { grid-area:greet; font-size:34px; line-height:1.05; font-weight:800; margin-top:2px; }
.page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; min-height:44px; }
.page-head h1 { font-size:34px; line-height:1.05; font-weight:800; }
.eyebrow { font-size:14px; font-weight:600; color:var(--ink-2); }
.icon-btn {
  width:44px; height:44px; border-radius:999px; display:grid; place-items:center; flex:none;
  color:var(--ink-2); background:var(--surface); box-shadow:var(--shadow);
}
.icon-btn.flat { background:transparent; box-shadow:none; }
.icon-btn:active { transform:scale(.94); }

/* ---------- Water chip ---------- */
.water {
  display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 14px 0 6px; border-radius:999px;
  background:var(--water-soft); color:var(--ink); font-weight:700; font-size:16px;
  -webkit-touch-callout:none;
}
.water .ring { width:32px; height:32px; }
.water .ring-fill { stroke:var(--water); }
.water .ring-track { stroke:color-mix(in srgb, var(--water) 22%, transparent); }
.water .num { font-weight:700; font-size:17px; }
.water .unit { font-weight:600; color:var(--water-ink); font-size:14px; margin-left:-4px; }
.water:active { transform:scale(.97); }
.water .drop { position:absolute; }
.ring { display:block; flex:none; }
.ring-track { stroke:var(--track); }
.ring-fill { transition:stroke-dashoffset .6s cubic-bezier(.34,1.45,.55,1); }

/* ---------- Today layout ---------- */
.today-grid { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
.col-a, .col-b { display:flex; flex-direction:column; gap:12px; min-width:0; }

/* ---------- Hero (the one saturated block) ---------- */
.hero {
  --hb:var(--school); --hf:var(--on-school);
  position:relative; display:block; width:100%; text-align:left; overflow:hidden;
  background:var(--hb); color:var(--hf); border-radius:var(--r-xl);
  padding:18px 20px 20px; min-height:176px;
  transition:background-color .35s ease, color .35s ease, transform .15s ease;
}
.hero:active { transform:scale(.985); }
.hero[data-area="gym"] { --hb:var(--gym); --hf:var(--on-gym); }
.hero[data-area="amber"] { --hb:var(--amber); --hf:var(--on-amber); }
.hero[data-area="todo"] { --hb:var(--todo); --hf:var(--on-todo); }
.hero-top { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:14px; font-weight:700; letter-spacing:.02em; }
.hero-top .go { width:34px; height:34px; border-radius:999px; display:grid; place-items:center; background:color-mix(in srgb, var(--hf) 16%, transparent); }
.hero-big { display:flex; align-items:baseline; flex-wrap:wrap; column-gap:10px; margin-top:10px; font-family:var(--f-display); line-height:.95; }
.hero-big .lead { font-size:26px; font-weight:700; }
.hero-big .n { font-size:88px; font-weight:800; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
.hero-big .u { font-size:28px; font-weight:700; }
.hero-big .t { font-size:44px; font-weight:800; letter-spacing:-.02em; line-height:1; }
.hero-sub { margin-top:10px; font-size:16px; font-weight:500; display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; }
.hero-sub .tag { font-size:13px; font-weight:700; letter-spacing:.03em; padding:3px 8px; border-radius:999px; background:color-mix(in srgb, var(--hf) 16%, transparent); }
.hero-bar { margin-top:16px; height:6px; border-radius:999px; background:color-mix(in srgb, var(--hf) 22%, transparent); overflow:hidden; }
.hero-bar span { display:block; height:100%; border-radius:inherit; background:var(--hf); transition:width .6s ease; }

/* ---------- Tiles ---------- */
.tiles { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
.tile {
  --tb:var(--gym-soft); --ta:var(--gym-ink); --tr:var(--gym);
  display:flex; flex-direction:column; align-items:flex-start; text-align:left; gap:2px; min-width:0;
  background:var(--tb); border-radius:var(--r-l); padding:14px 14px 16px; min-height:140px;
  transition:transform .15s ease;
}
.tile:active { transform:scale(.97); }
.tile.wide { grid-column:1 / -1; min-height:0; }
.tile[data-area="school"] { --tb:var(--school-soft); --ta:var(--school-ink); --tr:var(--school); }
.tile[data-area="food"] { --tb:var(--food-soft); --ta:var(--food-ink); --tr:var(--food-ring); }
.tile-top { display:flex; width:100%; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:auto; }
.tile-label { display:flex; align-items:center; gap:6px; font-size:14px; font-weight:700; color:var(--ta); padding-top:4px; }
.tile .ring-fill { stroke:var(--tr); }
.tile .ring-track { stroke:color-mix(in srgb, var(--tr) 20%, transparent); }
.tile-val { font-family:var(--f-display); font-size:32px; font-weight:800; line-height:1.05; letter-spacing:-.02em; margin-top:14px; font-variant-numeric:tabular-nums; }
.tile-val small { font-size:16px; font-weight:700; color:var(--ink-2); letter-spacing:0; margin-left:4px; }
.tile-sub { font-size:14px; color:var(--ink-2); font-weight:500; line-height:1.35; }
.tile.wide .tile-row { display:flex; align-items:center; gap:14px; width:100%; }
.tile.wide .tile-row .grow { flex:1; min-width:0; }
.tile.wide .tile-val { margin-top:2px; }

/* ---------- Cards ---------- */
.card { background:var(--surface); border-radius:var(--r-l); box-shadow:var(--shadow); padding:18px; min-width:0; }
.card-title { font-size:22px; font-weight:800; line-height:1.15; }

/* ---------- To-do ---------- */
.todo { padding:18px 16px 10px; border-radius:var(--r-xl); }
.todo-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 4px; }
.todo-title { display:flex; align-items:baseline; gap:10px; min-width:0; }
.todo-title h2 { font-size:26px; font-weight:800; }
.todo-count { font-family:var(--f-display); font-weight:700; font-size:17px; color:var(--todo-ink); font-variant-numeric:tabular-nums; white-space:nowrap; }
.seg { display:inline-flex; padding:3px; border-radius:999px; background:var(--surface-2); flex:none; }
.seg button { min-height:40px; padding:0 13px; border-radius:999px; font-size:14px; font-weight:700; color:var(--ink-2); transition:background-color .2s, color .2s; }
.seg button[aria-selected="true"], .seg button[aria-checked="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.14); }
.progress { height:5px; border-radius:999px; background:var(--todo-soft); margin:12px 4px 14px; overflow:hidden; }
.progress span { display:block; height:100%; border-radius:inherit; background:var(--todo); transition:width .5s cubic-bezier(.3,1.2,.5,1); }
.add-row { display:flex; align-items:center; gap:8px; background:var(--surface-2); border-radius:var(--r-m); padding:4px 4px 4px 16px; }
.add-row input { flex:1; min-width:0; height:48px; border:0; background:transparent; font-size:17px; font-weight:500; }
.add-row input::placeholder { color:var(--ink-3); }
.add-row input:focus-visible { outline:none; }
.add-row:focus-within { box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 45%, transparent); }
.add-btn { width:44px; height:44px; border-radius:999px; display:grid; place-items:center; background:var(--todo); color:var(--on-todo); flex:none; transition:transform .15s; }
.add-btn:active { transform:scale(.9); }
.tasks { margin-top:6px; }
.task {
  display:flex; align-items:center; gap:4px; min-height:52px; border-radius:14px; position:relative; overflow:hidden;
  -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  transition:max-height .26s ease, min-height .26s ease, opacity .26s ease, transform .26s ease, background-color .2s;
  max-height:200px;
}
.task + .task { box-shadow:0 -1px 0 var(--line); }
.task.enter { animation:taskIn .3s cubic-bezier(.2,.9,.3,1.2); }
@keyframes taskIn { from { opacity:0; transform:translateY(-8px); } }
.task.fold { opacity:0; max-height:0; min-height:0; transform:translateX(10px); }
.task.pressing { background:var(--surface-2); }
.check { width:48px; height:48px; display:grid; place-items:center; flex:none; border-radius:999px; }
.check .box { width:28px; height:28px; border-radius:999px; border:2.5px solid var(--ink-3); display:grid; place-items:center; transition:background-color .18s ease, border-color .18s ease, transform .16s ease; }
.check svg { width:16px; height:16px; fill:none; stroke:var(--on-todo); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
.check path { stroke-dasharray:20; stroke-dashoffset:20; transition:stroke-dashoffset .22s ease .04s; }
.is-done > .check .box { background:var(--todo); border-color:var(--todo); }
.is-done > .check path { stroke-dashoffset:0; }
.task-text { flex:1; min-width:0; font-size:17px; font-weight:500; line-height:1.3; padding:8px 0; overflow-wrap:anywhere; }
.tt { background-image:linear-gradient(currentColor, currentColor); background-repeat:no-repeat; background-position:0 58%; background-size:0 2px; transition:background-size .25s ease, color .25s; }
.is-done .tt { background-size:100% 2px; color:var(--ink-3); }
.task-meta { display:inline-flex; flex-wrap:wrap; gap:6px; margin-left:8px; vertical-align:1px; }
.chip-s { display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--ink-2); white-space:nowrap; line-height:1.4; }
.chip-s.carry { background:var(--todo-soft); color:var(--todo-ink); }
.pin-ic { color:var(--todo-ink); display:inline-grid; vertical-align:-2px; margin-right:6px; }
.more-btn { width:44px; height:44px; border-radius:999px; display:none; place-items:center; color:var(--ink-3); flex:none; }
@media (hover:hover) and (pointer:fine) { .more-btn { display:grid; opacity:.5; } .task:hover .more-btn, .more-btn:focus-visible { opacity:1; } }
.fold-line { display:flex; align-items:center; gap:8px; width:100%; min-height:48px; padding:0 12px; margin-top:2px; border-radius:14px; color:var(--ink-2); font-weight:600; font-size:15px; }
.fold-line .ok { width:24px; height:24px; border-radius:999px; background:var(--todo-soft); color:var(--todo-ink); display:grid; place-items:center; }
.fold-line .chev { margin-left:auto; transition:transform .2s; color:var(--ink-3); }
.fold-line[aria-expanded="true"] .chev { transform:rotate(90deg); }
.done-list { margin-bottom:4px; }
.older { display:flex; align-items:center; gap:10px; min-height:52px; margin:6px 0 6px; padding:4px 4px 4px 14px; border-radius:16px; background:var(--surface-2); font-size:15px; color:var(--ink-2); }
.older p { flex:1; min-width:0; }
.older strong { color:var(--ink); font-weight:700; }
.btn-text { min-height:44px; padding:0 14px; border-radius:999px; font-weight:700; font-size:15px; color:var(--todo-ink); flex:none; }
.btn-text:active { background:var(--todo-soft); }
.empty { padding:18px 8px 14px; color:var(--ink-2); font-size:15px; text-align:center; }

/* ---------- Buttons ---------- */
.btn { min-height:48px; padding:0 20px; border-radius:999px; font-weight:700; font-size:16px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .12s, background-color .2s; }
.btn:active { transform:scale(.97); }
.btn.primary { background:var(--ink); color:var(--surface); }
.btn.todo { background:var(--todo); color:var(--on-todo); }
.btn.gym { background:var(--gym); color:var(--on-gym); }
.btn.school { background:var(--school); color:var(--on-school); }
.btn.food { background:var(--food); color:var(--on-food); }
.btn.ghost { background:var(--surface-2); color:var(--ink); }
.btn.block { width:100%; }
.btn[disabled] { opacity:.45; cursor:default; }
.link { min-height:44px; padding:0 8px; font-size:14px; font-weight:600; color:var(--ink-3); text-decoration:underline; text-underline-offset:3px; }

/* ---------- Sheet ---------- */
.sheet-root { position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center; }
.scrim { position:absolute; inset:0; background:var(--scrim); opacity:0; transition:opacity .28s ease; }
.sheet {
  position:relative; width:100%; max-width:560px; max-height:88vh; max-height:88dvh; overflow:auto; overscroll-behavior:contain;
  background:var(--surface); border-radius:28px 28px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.18);
  padding-top:8px; padding-bottom:calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left:max(18px, env(safe-area-inset-left, 0px)); padding-right:max(18px, env(safe-area-inset-right, 0px));
  transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
}
.sheet-root.open .scrim { opacity:1; }
.sheet-root.open .sheet { transform:none; }
.grab { width:40px; height:5px; border-radius:999px; background:var(--line); margin:4px auto 8px; }
.sheet-head { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:48px; }
.sheet-head h2 { font-size:24px; font-weight:800; min-width:0; overflow-wrap:anywhere; }
.sheet-body { display:flex; flex-direction:column; gap:16px; padding-top:8px; }
.sheet-note { color:var(--ink-2); font-size:15px; }
.sheet-actions { display:flex; gap:10px; }
.sheet-actions .btn { flex:1; padding:0 12px; }
.menu-list { display:flex; flex-direction:column; background:var(--surface-2); border-radius:var(--r-m); overflow:hidden; }
.menu-item { display:flex; align-items:center; gap:14px; min-height:54px; padding:0 16px; font-size:17px; font-weight:600; text-align:left; width:100%; }
.menu-item + .menu-item { box-shadow:0 -1px 0 var(--line); }
.menu-item svg { color:var(--ink-2); }
.menu-item:active { background:var(--line); }
.menu-item .r { margin-left:auto; color:var(--ink-3); font-weight:500; font-size:15px; white-space:nowrap; }
.stepper { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.stepper .val { font-family:var(--f-display); font-weight:800; font-size:44px; font-variant-numeric:tabular-nums; line-height:1; text-align:center; flex:1; }
.stepper .val small { font-size:20px; color:var(--ink-2); font-weight:700; margin-left:4px; }
.step-btn { width:56px; height:56px; border-radius:999px; background:var(--surface-2); display:grid; place-items:center; font-size:28px; font-weight:600; flex:none; }
.step-btn:active { background:var(--line); }
.rep-grid { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; }
.rep { min-height:48px; border-radius:14px; background:var(--surface-2); font-family:var(--f-display); font-weight:800; font-size:20px; font-variant-numeric:tabular-nums; }
.rep[aria-checked="true"] { background:var(--gym); color:var(--on-gym); }
.field-label { font-size:14px; font-weight:700; color:var(--ink-2); }
.set-row { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:54px; }
.set-row + .set-row { box-shadow:0 -1px 0 var(--line); }
.set-row .lbl { font-weight:600; min-width:0; }
.set-row .lbl small { display:block; font-size:13px; color:var(--ink-3); font-weight:500; }
.mini-step { display:flex; align-items:center; gap:4px; flex:none; }
.mini-step button { width:44px; height:44px; border-radius:999px; background:var(--surface-2); font-size:22px; font-weight:600; display:grid; place-items:center; }
.mini-step output { min-width:58px; text-align:center; font-family:var(--f-display); font-weight:800; font-size:18px; font-variant-numeric:tabular-nums; }
.text-in { width:100%; height:52px; border-radius:14px; border:0; background:var(--surface-2); padding:0 16px; font-size:17px; }
.text-in:focus-visible { outline:3px solid var(--focus); outline-offset:0; }
.switch { position:relative; width:52px; height:32px; border-radius:999px; background:var(--line); flex:none; transition:background-color .2s; }
.switch::after { content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:999px; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s; }
.switch[aria-checked="true"] { background:var(--school); }
.switch[aria-checked="true"]::after { transform:translateX(20px); }
.switch-hit { min-height:44px; min-width:52px; display:flex; align-items:center; justify-content:flex-end; }
.group-title { font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin:4px 4px -8px; }
.pick-row { display:flex; flex-wrap:wrap; gap:8px; }
.pick { min-height:44px; padding:0 16px; border-radius:999px; background:var(--surface-2); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; }
.pick[aria-checked="true"] { background:var(--ink); color:var(--surface); }

/* ---------- Toast + rest timer ---------- */
.float-zone {
  position:fixed; left:0; right:0; z-index:50; pointer-events:none;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 10px);
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.toast, .rest { pointer-events:auto; width:100%; max-width:440px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.22); animation:slideUp .28s cubic-bezier(.2,.9,.3,1.1); }
@keyframes slideUp { from { transform:translateY(24px); opacity:0; } }
.toast { display:flex; align-items:center; gap:10px; min-height:52px; padding:4px 6px 4px 18px; background:var(--ink); color:var(--surface); font-weight:600; font-size:15px; }
.toast p { flex:1; min-width:0; }
.toast button { min-height:44px; padding:0 14px; border-radius:999px; font-weight:800; color:var(--surface); background:color-mix(in srgb, var(--surface) 16%, transparent); flex:none; }
.rest { display:flex; align-items:center; gap:10px; padding:6px 6px 6px 16px; background:var(--gym); color:var(--on-gym); position:relative; overflow:hidden; }
.rest .lbl { font-weight:700; font-size:15px; }
.rest .t { font-family:var(--f-display); font-weight:800; font-size:26px; font-variant-numeric:tabular-nums; margin-right:auto; }
.rest .bar { position:absolute; left:0; bottom:0; height:4px; background:var(--on-gym); opacity:.35; transition:width .25s linear; }
.rest button { min-width:44px; height:44px; border-radius:999px; display:grid; place-items:center; background:color-mix(in srgb, var(--on-gym) 14%, transparent); }
.rest .plus { padding:0 12px; font-weight:800; font-size:14px; }

/* ---------- Gym ---------- */
.gym-head { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:start; }
.gym-head .eyebrow { color:var(--gym-ink); }
.day-pick { display:inline-flex; align-items:center; gap:6px; min-height:44px; margin-left:-4px; padding:0 4px; border-radius:14px; }
.day-pick h1 { font-size:56px; line-height:.95; font-weight:800; letter-spacing:-.03em; }
.day-pick .chev { width:34px; height:34px; border-radius:999px; background:var(--gym-soft); color:var(--gym-ink); display:grid; place-items:center; margin-top:8px; }
.gym-meta { grid-column:1 / -1; font-size:15px; color:var(--ink-2); font-weight:500; }
.session { display:flex; align-items:center; gap:12px; }
.session .bar { flex:1; height:10px; border-radius:999px; background:var(--gym-soft); overflow:hidden; }
.session .bar span { display:block; height:100%; border-radius:inherit; background:var(--gym); transition:width .45s cubic-bezier(.3,1.3,.5,1); }
.session .cnt { font-family:var(--f-display); font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.session .cnt small { color:var(--ink-2); font-weight:600; font-size:15px; }
.ex { padding:16px; border-radius:var(--r-l); }
.ex-head { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.ex-name { font-family:var(--f-display); font-size:21px; font-weight:800; line-height:1.15; }
.ex-last { font-size:14px; color:var(--ink-3); font-weight:500; margin-top:2px; font-variant-numeric:tabular-nums; }
.pills { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-top:14px; }
.pill {
  position:relative; min-height:64px; border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  background:var(--gym-soft); color:var(--gym-ink); border:2px dashed color-mix(in srgb, var(--gym) 50%, transparent);
  -webkit-touch-callout:none; transition:background-color .16s ease, color .16s ease, border-color .16s ease;
}
.pill .pv { font-family:var(--f-display); font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.01em; line-height:1.1; }
.pill .ps { font-size:13px; font-weight:600; opacity:.9; display:flex; align-items:center; gap:3px; }
.pill.done { background:var(--gym); color:var(--on-gym); border-color:transparent; border-style:solid; }
.pill.pop { animation:pop .16s ease-out; }
@keyframes pop { 50% { transform:scale(1.08); } }
.ex-result { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:14px 16px; border-radius:var(--r-l); background:var(--surface); box-shadow:var(--shadow); }
.ex-result .tick { width:36px; height:36px; border-radius:999px; background:var(--gym); color:var(--on-gym); display:grid; place-items:center; flex:none; }
.ex-result .body { flex:1; min-width:0; }
.ex-result .nm { font-weight:700; font-size:16px; }
.ex-result .sets { font-family:var(--f-display); font-weight:700; font-size:16px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.up { display:inline-flex; align-items:center; gap:3px; font-size:13px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--gym-soft); color:var(--gym-ink); white-space:nowrap; }
.summary { background:var(--gym); color:var(--on-gym); border-radius:var(--r-xl); padding:20px; display:flex; flex-direction:column; gap:14px; animation:slideUp .32s cubic-bezier(.2,.9,.3,1.1); }
.summary .eb { font-size:14px; font-weight:700; letter-spacing:.02em; }
.summary h2 { font-size:44px; font-weight:800; line-height:1; letter-spacing:-.03em; }
.stats { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
.stat { background:color-mix(in srgb, var(--on-gym) 10%, transparent); border-radius:16px; padding:10px 12px; }
.stat b { display:block; font-family:var(--f-display); font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1; }
.stat span { font-size:13px; font-weight:600; }
.best { display:flex; gap:12px; align-items:center; background:color-mix(in srgb, var(--on-gym) 10%, transparent); border-radius:16px; padding:12px 14px; font-size:15px; font-weight:600; }
.best b { font-family:var(--f-display); font-weight:800; font-size:17px; display:block; }
.best .ic { width:36px; height:36px; border-radius:999px; background:var(--on-gym); color:var(--gym); display:grid; place-items:center; flex:none; }
.demo { display:flex; justify-content:center; }

/* ---------- School ---------- */
.commute { --hb:var(--school); --hf:var(--on-school); background:var(--hb); color:var(--hf); border-radius:var(--r-xl); padding:16px 18px 18px; display:flex; flex-direction:column; gap:12px; }
.commute .row1 { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.commute .row1 .lbl { font-size:14px; font-weight:700; letter-spacing:.02em; }
.tt-tag { font-size:13px; font-weight:700; padding:3px 9px; border-radius:999px; background:color-mix(in srgb, var(--hf) 16%, transparent); display:inline-flex; align-items:center; gap:5px; }
.commute .gear { width:44px; height:44px; border-radius:999px; display:grid; place-items:center; color:var(--hf); background:color-mix(in srgb, var(--hf) 14%, transparent); }
.commute .big { font-family:var(--f-display); font-weight:800; font-size:50px; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
.commute .big small { font-size:22px; font-weight:700; letter-spacing:0; margin-left:6px; }
.commute .note { font-size:15px; font-weight:500; margin-top:4px; }
.journey { position:relative; display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:2px; margin-top:4px; }
.journey::before { content:""; position:absolute; top:19px; left:8%; right:8%; height:3px; border-radius:3px; background:color-mix(in srgb, var(--hf) 35%, transparent); }
.leg { position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; gap:3px; min-width:0; }
.leg .dot { width:40px; height:40px; border-radius:999px; display:grid; place-items:center; background:var(--hb); box-shadow:inset 0 0 0 2.5px var(--hf); }
.leg.key .dot { background:var(--hf); color:var(--hb); }
.leg .ln { font-size:13px; font-weight:700; line-height:1.15; margin-top:3px; }
.leg .tm { font-size:13px; font-weight:500; font-variant-numeric:tabular-nums; opacity:.92; }
.alts { display:flex; flex-wrap:wrap; gap:8px; }
.alt { min-height:44px; padding:0 14px; border-radius:999px; font-size:14px; font-weight:700; color:var(--hf); background:color-mix(in srgb, var(--hf) 14%, transparent); font-variant-numeric:tabular-nums; }
.alt[aria-pressed="true"] { background:var(--hf); color:var(--hb); }
.upnext { display:flex; flex-direction:column; gap:12px; }
.upnext .sum { font-size:17px; font-weight:500; color:var(--ink-2); }
.upnext .sum b { color:var(--ink); font-weight:700; }
.add-row.school:focus-within { box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 45%, transparent); }
.add-row .go-btn { min-height:44px; padding:0 16px; border-radius:999px; background:var(--school); color:var(--on-school); font-weight:700; flex:none; }
.preview { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14px; color:var(--ink-2); font-weight:600; min-height:32px; }
.preview .pc { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--school-soft); color:var(--school-ink); font-weight:700; animation:slideUp .18s ease-out; }
.hw-list { display:flex; flex-direction:column; }
.hw { display:flex; align-items:center; gap:6px; min-height:60px; }
.hw + .hw { box-shadow:0 -1px 0 var(--line); }
.hw .check .box { border-color:var(--ink-3); }
.hw.is-done .check .box { background:var(--school); border-color:var(--school); }
.hw .check svg { stroke:var(--on-school); }
.hw .body { flex:1; min-width:0; padding:8px 0; }
.hw .nm { font-size:16px; font-weight:600; line-height:1.3; overflow-wrap:anywhere; }
.hw .sub { font-size:14px; color:var(--ink-3); font-weight:500; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.test { font-size:13px; font-weight:800; letter-spacing:.06em; padding:1px 7px; border-radius:6px; background:var(--school); color:var(--on-school); }
.due { flex:none; font-size:13px; font-weight:700; padding:6px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink-2); white-space:nowrap; font-variant-numeric:tabular-nums; }
.due.soon { background:var(--school-soft); color:var(--school-ink); }
.score-chip { flex:none; min-height:44px; padding:0 14px; border-radius:999px; background:var(--school-soft); color:var(--school-ink); font-weight:800; font-size:14px; }
.hw.past .nm { color:var(--ink-2); }
.row-link { display:flex; align-items:center; gap:12px; width:100%; min-height:60px; padding:0 18px; border-radius:var(--r-l); background:var(--school-soft); color:var(--ink); text-align:left; font-weight:700; font-size:17px; }
.row-link .r { margin-left:auto; display:flex; align-items:center; gap:6px; color:var(--school-ink); font-family:var(--f-display); font-weight:800; font-size:19px; font-variant-numeric:tabular-nums; }
.grade { display:grid; grid-template-columns:96px minmax(0,1fr) 44px; align-items:center; gap:12px; min-height:44px; font-weight:600; }
.grade .gb { height:10px; border-radius:999px; background:var(--school-soft); overflow:hidden; }
.grade .gb span { display:block; height:100%; border-radius:inherit; background:var(--school); }
.grade .gv { text-align:right; font-family:var(--f-display); font-weight:800; font-size:18px; font-variant-numeric:tabular-nums; }

/* ---------- Food ---------- */
.date-nav { display:flex; align-items:center; gap:2px; margin-left:-10px; }
.date-nav button { width:44px; height:44px; border-radius:999px; display:grid; place-items:center; color:var(--ink-2); }
.date-nav button[disabled] { opacity:.3; cursor:default; }
.date-nav span { font-size:15px; font-weight:700; color:var(--ink-2); min-width:84px; text-align:center; }
.ai { display:flex; flex-direction:column; gap:12px; }
.ai label { font-family:var(--f-display); font-size:24px; font-weight:800; line-height:1.15; }
.add-row.food:focus-within { box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 45%, transparent); }
.add-row .food-go { min-height:44px; padding:0 18px; border-radius:999px; background:var(--food); color:var(--on-food); font-weight:800; flex:none; }
.thinking { display:flex; flex-direction:column; gap:8px; font-size:15px; color:var(--ink-2); font-weight:600; }
.thinking .tb { height:6px; border-radius:999px; background:var(--food-soft); overflow:hidden; }
.thinking .tb span { display:block; height:100%; width:100%; background:var(--food-ring); transform-origin:left; animation:fill .7s ease-out both; border-radius:inherit; }
@keyframes fill { from { transform:scaleX(0); } }
.parsed { background:var(--food-soft); border-radius:var(--r-m); padding:6px 14px 14px; display:flex; flex-direction:column; gap:4px; animation:slideUp .22s ease-out; }
.parsed .it { display:flex; align-items:baseline; gap:10px; min-height:40px; padding-top:8px; font-weight:600; }
.parsed .it + .it { box-shadow:0 -1px 0 color-mix(in srgb, var(--food-ring) 25%, transparent); }
.parsed .it .k { margin-left:auto; font-family:var(--f-display); font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
.parsed .it small { display:block; color:var(--ink-2); font-weight:500; font-size:13px; }
.parsed .tot { display:flex; justify-content:space-between; font-size:14px; color:var(--ink-2); font-weight:600; padding:6px 0 4px; }
.qchips { display:flex; flex-wrap:wrap; gap:8px; }
.qchip { min-height:44px; padding:0 14px 0 10px; border-radius:999px; background:var(--food-soft); color:var(--ink); font-weight:700; font-size:14px; display:inline-flex; align-items:center; gap:6px; }
.qchip svg { color:var(--food-ink); }
.qchip small { color:var(--ink-2); font-weight:600; font-size:13px; }
.qchip:active { transform:scale(.96); }
.fsum { display:flex; align-items:center; gap:18px; }
.fring { position:relative; width:132px; height:132px; flex:none; }
.fring .ring-fill { stroke:var(--food-ring); }
.fring .ring-track { stroke:var(--food-soft); }
.fring .c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.fring .c b { font-family:var(--f-display); font-size:30px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.fring .c span { font-size:13px; color:var(--ink-2); font-weight:600; margin-top:3px; }
.macros { flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; }
.macro .mh { display:flex; justify-content:space-between; gap:8px; font-size:14px; font-weight:600; }
.macro .mh span:last-child { color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap; }
.macro .mb { height:8px; border-radius:999px; background:var(--food-soft); overflow:hidden; margin-top:5px; }
.macro .mb span { display:block; height:100%; border-radius:inherit; background:var(--food-ring); transition:width .6s cubic-bezier(.3,1.3,.5,1); }
.macro.c .mb span { background:color-mix(in srgb, var(--food-ring) 62%, var(--surface)); }
.macro.f .mb span { background:color-mix(in srgb, var(--food-ring) 40%, var(--surface)); }
.diary-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.meal { margin-top:12px; }
.meal-h { display:flex; justify-content:space-between; gap:8px; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); padding:0 2px 4px; }
.entry { display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:0 2px; text-align:left; font-weight:500; font-size:16px; }
.entry + .entry { box-shadow:0 -1px 0 var(--line); }
.entry .k { margin-left:auto; font-family:var(--f-display); font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink-2); white-space:nowrap; }
.chip-btn { min-height:44px; padding:0 14px; border-radius:999px; background:var(--surface-2); font-weight:700; font-size:14px; color:var(--ink-2); display:inline-flex; align-items:center; gap:6px; }
.more summary { list-style:none; display:flex; align-items:center; justify-content:space-between; min-height:44px; font-weight:700; font-size:17px; cursor:pointer; border-radius:12px; }
.more summary::-webkit-details-marker { display:none; }
.more summary .chev { transition:transform .2s; color:var(--ink-3); }
.more[open] summary .chev { transform:rotate(90deg); }
.more .in { display:flex; flex-direction:column; gap:12px; padding-top:12px; }
.res { display:flex; align-items:center; gap:10px; min-height:48px; }
.res + .res { box-shadow:0 -1px 0 var(--line); }
.res .nm { flex:1; min-width:0; font-weight:600; }
.res .nm small { display:block; color:var(--ink-3); font-weight:500; font-size:13px; }
.qa-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto; gap:8px; align-items:end; }
.qa-grid label { display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:700; color:var(--ink-2); min-width:0; }

/* ---------- Settings ---------- */
.set-avatar { display:flex; align-items:center; gap:12px; }
.set-avatar .av { width:52px; height:52px; border-radius:999px; background:var(--todo); color:var(--on-todo); display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:22px; flex:none; }
.pages-cap { font-size:14px; color:var(--ink-3); margin:-6px 4px 0; }
.confirm { display:flex; flex-direction:column; gap:10px; background:var(--surface-2); border-radius:var(--r-m); padding:14px; }

/* ---------- Desktop ---------- */
@media (min-width: 900px) {
  .tabs { top:0; right:auto; width:104px; box-shadow:1px 0 0 var(--line); padding:calc(env(safe-area-inset-top, 0px) + 28px) 0 24px max(0px, env(safe-area-inset-left, 0px)); }
  .tabs-in { grid-template-columns:1fr; grid-auto-rows:84px; height:auto; align-content:start; }
  .tab .tab-ic { width:60px; height:36px; }
  .views { padding-left:calc(104px + 40px); padding-right:40px; padding-top:36px; padding-bottom:56px; }
  .today-grid { grid-template-columns:minmax(0,1fr) minmax(0,1.12fr); gap:24px; align-items:start; }

/* ================= Rings + counting numbers ================= */
const prev = new Map();
function ring(key, p, size, sw) {
  const r = (size - sw) / 2, c = 2 * Math.PI * r, pp = clamp(p || 0, 0, 1), h = size / 2;
  return '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">' +
    '<circle class="ring-track" cx="' + h + '" cy="' + h + '" r="' + r + '" fill="none" stroke-width="' + sw + '"/>' +
    '<circle class="ring-fill" data-ring="' + key + '" data-p="' + pp + '" data-c="' + c + '" cx="' + h + '" cy="' + h + '" r="' + r +
    '" fill="none" stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - pp)) +
    '" transform="rotate(-90 ' + h + ' ' + h + ')"' + (pp <= 0.001 ? ' opacity="0"' : '') + '/></svg>';
}
const numEl = (key, v, dec) => '<span class="num" data-num="' + key + '" data-v="' + v + '" data-dec="' + (dec || 0) + '">' + fmtN(v, dec) + '</span>';
function animate(root) {
  if (!root || !root.getClientRects().length) return;
  $$('[data-ring]', root).forEach(el => {
    const k = 'r:' + el.dataset.ring, p = +el.dataset.p, c = +el.dataset.c;
    const from = prev.has(k) ? prev.get(k) : 0;
    prev.set(k, p);
    if (reduced() || from === p) return;
    el.style.transition = 'none';
    el.style.strokeDashoffset = String(c * (1 - from));
    el.getBoundingClientRect();
    el.style.transition = '';
    el.style.strokeDashoffset = String(c * (1 - p));
  });
  $$('[data-num]', root).forEach(el => {
    const k = 'n:' + el.dataset.num, v = +el.dataset.v, dec = +(el.dataset.dec || 0);
    const from = prev.has(k) ? prev.get(k) : 0;
    prev.set(k, v);
    if (reduced() || from === v) return;
    const dur = from === 0 ? 650 : 360;
    let t0 = null;
    const step = now => {
      if (t0 === null) t0 = now;
      const q = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - q, 3);
      el.textContent = fmtN(from + (v - from) * e, dec);
      if (q < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

/* ================= Commute model ================= */
function commuteOut(off) {
  const c = S.commute, start = c.start[dow(off)];
  if (start == null) return null;
  const head = c.walk1 + c.bus1 + c.buffer, tail = c.wait2 + c.bus2 + c.walk2;
  const opts = TRAIN_OUT.map(d => ({ train: d, leave: d - head, arr: d + c.train + tail }));
  opts.forEach(o => { o.ok = o.arr <= start; o.spare = start - o.arr; });
  let best = null;
  opts.forEach(o => { if (o.ok) best = o; });
  if (!best) best = opts[0];
  return { start, opts, best, off };
}
function morningPlan() {
  const o = commuteOut(0);
  if (!o) return null;
  let pick = S.commute.pick != null ? o.opts.find(x => x.train === S.commute.pick) : null;
  if (!pick) {
    pick = o.best;
    if (S.now > pick.leave) pick = o.opts.find(x => x.leave >= S.now) || pick;
  }
  return Object.assign({}, o, { pick });
}
function commuteBack() {
  const c = S.commute, tail = c.walk2 + c.bus2 + c.wait2, earliest = Math.max(c.end, S.now);
  const opts = TRAIN_BACK.map(d => ({ train: d, leave: d - tail, home: d + c.train + c.bus1 + c.walk1 }));
  const best = opts.find(o => o.leave >= earliest) || opts[opts.length - 1];
  let pick = S.commute.pickBack != null ? opts.find(o => o.train === S.commute.pickBack) : null;
  if (!pick) pick = best;
  return { opts, pick, best };
}
function phase() {
  const n = S.now, o = commuteOut(0);
  if (!o || S.commute.off) return 'free';
  if (n < o.start) return 'morning';
  if (n < S.commute.end - 30) return 'school';
  if (n < tm('16:00')) return 'after';
  return 'evening';
}
const round5 = m => Math.round(m / 5) * 5;

/* ================= Gym model ================= */
function sess(day) {
  day = day || S.gym.day;
  if (!S.gym.sess[day]) {
    const s = {};
    S.gym.plans[day].forEach(ex => { s[ex.id] = [0, 1, 2].map(() => ({ w: ex.w, r: ex.r, done: false })); });
    S.gym.sess[day] = s;
  }
  const s = S.gym.sess[day];
  S.gym.plans[day].forEach(ex => { if (!s[ex.id]) s[ex.id] = [0, 1, 2].map(() => ({ w: ex.w, r: ex.r, done: false })); });
  return s;
}
function gymProgress(day) {
  day = day || S.gym.day;
  const s = sess(day);
  let done = 0, total = 0;
  S.gym.plans[day].forEach(ex => s[ex.id].forEach(x => { total++; if (x.done) done++; }));
  return { done, total, active: done > 0 && done < total, finished: total > 0 && done === total };
}
const exById = id => S.gym.plans[S.gym.day].find(e => e.id === id);

function heroModel() {
  const g = gymProgress();
  if (g.active) {
    const plan = S.gym.plans[S.gym.day], s = sess();
    const nextEx = plan.find(ex => s[ex.id].some(x => !x.done));
    const nx = nextEx ? s[nextEx.id].find(x => !x.done) : null;
    return {
      area: 'gym', tab: 'gym', eyebrow: 'Workout in progress',
      big: '<span class="lead">' + S.gym.day + ' ·</span><span class="n">' + numEl('hero-gym', g.done) + '</span><span class="u">of ' + g.total + ' sets</span>',
      sub: nextEx ? 'Next: ' + esc(nextEx.name) + ' · ' + fw(nx.w) + '×' + nx.r : 'Last set coming up',
      bar: g.done / g.total, label: S.gym.day + ', ' + g.done + ' of ' + g.total + ' sets logged. Open Gym.'
    };
  }
  const ph = phase();
  if (ph === 'morning') {
    const m = morningPlan(), p = m.pick, mins = p.leave - S.now;
    if (!p.ok) {
      return {
        area: 'school', tab: 'school', eyebrow: 'To school',
        big: '<span class="lead">Next train</span><span class="t">' + hhmm(p.train) + '</span>',
        sub: 'Leave ' + hhmm(p.leave) + ' · arrives ' + hhmm(p.arr) + ', ' + (-p.spare) + ' min after school starts <span class="tag">Timetable</span>',
        label: 'Next train ' + hhmm(p.train) + '. Open School.'
      };
    }
    return {
      area: mins <= 5 ? 'amber' : 'school', tab: 'school', eyebrow: 'To school · ' + hhmm(m.start) + ' start',
      big: mins > 0 ? '<span class="lead">Leave in</span><span class="n">' + numEl('hero-min', mins) + '</span><span class="u">min</span>' : '<span class="t">Leave now</span>',
      sub: hhmm(p.leave) + ' · bus → ' + hhmm(p.train) + ' train <span class="tag">Timetable</span>',
      bar: clamp(mins / 20, 0, 1), label: 'Leave in ' + mins + ' minutes, at ' + hhmm(p.leave) + '. Open School.'
    };
  }
  if (ph === 'school') {
    const open = schoolOpen();
    const test = open.find(x => isTest(x) && x.off >= 0 && x.off <= 2);
    const it = test || open[0];
    if (it) {
      return {
        area: 'school', tab: 'school', eyebrow: test ? 'Coming up' : 'Next due',
        big: '<span class="t">' + esc(it.short) + ' · ' + (it.off === 0 ? 'Today' : it.off === 1 ? 'Tomorrow' : dowL(it.off)) + '</span>',
        sub: it.off + ' ' + plural(it.off, 'day', 'days') + (it.title.indexOf('·') > 0 ? ' · ' + esc(it.title.split('·')[1].trim()) : ''),
        label: it.short + ' on ' + dowL(it.off) + '. Open School.'
      };
    }
  }
  if (ph === 'after') {
    const b = commuteBack(), mins = b.pick.leave - S.now;
    return {
      area: mins <= 5 && mins >= 0 ? 'amber' : 'school', tab: 'school', eyebrow: 'Going home',
      big: '<span class="lead">Train home</span><span class="n">' + hhmm(b.pick.train) + '</span>',
      sub: 'Leave school by ' + hhmm(b.pick.leave) + ' · ' + (mins > 0 ? 'in ' + mins + ' min' : 'now') + ' <span class="tag">Timetable</span>',
      bar: clamp(mins / 20, 0, 1), label: 'Train home ' + hhmm(b.pick.train) + ', leave school by ' + hhmm(b.pick.leave) + '. Open School.'
    };
  }
  if (ph === 'free') {
    return {
      area: 'school', tab: 'school', eyebrow: 'No school',
      big: '<span class="t">Free until ' + dowL(S.commute.offUntil) + '</span>',
      sub: 'Commute is paused · back on ' + dShort(S.commute.offUntil), label: 'No school. Open School.'
    };
  }
  const t = commuteOut(1);
  const tmr = S.tasks.find(x => x.day === 'tomorrow' && !x.done);
  if (!t) {
    return { area: 'todo', tab: 'today', eyebrow: 'Tomorrow · ' + dow(1), big: '<span class="t">No school</span>', sub: tmr ? esc(tmr.text) + ' is on your list' : 'Nothing planned yet', label: 'Tomorrow' };
  }
  return {
    area: 'school', tab: 'school', eyebrow: 'Tomorrow · ' + dShort(1),
    big: '<span class="lead">Leave</span><span class="n">' + hhmm(t.best.leave) + '</span>',
    sub: hhmm(t.best.train) + ' train' + (tmr ? ' · ' + esc(tmr.text) + ' on your list' : '') + ' <span class="tag">Timetable</span>',
    label: 'Tomorrow, leave ' + hhmm(t.best.leave) + '. Open School.'
  };
}

function exDelta(ex, arr) {
  const top = Math.max.apply(null, arr.map(x => x.w));
  const d = Math.round((top - ex.last.w) * 10) / 10;
  if (d > 0) return { up: true, txt: '+' + fw(d) + ' kg vs last' };
  const reps = arr.reduce((a, x) => a + x.r, 0), lastReps = ex.last.reps.reduce((a, b) => a + b, 0);
  if (d === 0 && reps > lastReps) return { up: true, txt: '+' + (reps - lastReps) + ' reps vs last' };
  return { up: false, txt: d === 0 ? 'Same as last' : 'Lighter today' };
}
function exHtml(ex, arr) {

    return '<button class="ex-result" id="exr-' + ex.id + '" data-act="ex-open" data-ex="' + ex.id + '" aria-label="' + esc(ex.name) + ' done, ' + setsLine(arr) + '. Tap to change.">' +

  }
  const pills = arr.map((x, i) => {

    return '<button class="pill' + (x.done ? ' done' : '') + (S.gym.popKey === key ? ' pop' : '') + '" id="pill-' + ex.id + '-' + i + '" data-act="pill" data-lp="pill-adjust" data-ex="' + ex.id + '" data-i="' + i +

  }).join('');

function summaryHtml(day) {
  const plan = S.gym.plans[day], s = sess(day);
  let vol = 0, lastVol = 0, sets = 0, best = null;
  plan.forEach(ex => {
    s[ex.id].forEach(x => { vol += x.w * x.r; sets++; });
    lastVol += ex.last.w * ex.last.reps.reduce((a, b) => a + b, 0);
    const top = s[ex.id].reduce((m, x) => (x.w > m.w ? x : m), s[ex.id][0]);
    if (!best && top.w > ex.last.w) best = { ex: ex, w: top.w, r: top.r };
  });
  const pct = lastVol ? Math.round((vol - lastVol) / lastVol * 100) : 0;
  return '<section class="summary" id="summary" aria-label="Session summary"><p class="eb">Session summary · vs last ' + day + '</p><h2>' + day + ' done</h2>' +
    '<div class="stats"><div class="stat"><b>' + sets + '/' + sets + '</b><span>sets</span></div>' +
    '<div class="stat"><b>' + (pct >= 0 ? '+' : '') + pct + '%</b><span>volume</span></div>' +
    '<div class="stat"><b>' + fmtN(vol) + '</b><span>kg lifted</span></div></div>' +
    (best ? '<div class="best"><span class="ic">' + ic('up', 'sm') + '</span><div><b>New best · ' + esc(best.ex.name) + '</b>' + fw(best.w) + ' × ' + best.r + ' · heaviest yet · est. 1RM ' + Math.round(brz(best.w, best.r)) + ' kg</div></div>'
      : '<div class="best"><span class="ic">' + ic('check', 'sm') + '</span><div><b>Baseline set</b>Next time compares against today.</div></div>') +
    '<button class="link" id="gym-reset" data-act="gym-reset">Start this workout again (demo)</button></section>';
}

/* ---------- Rest timer ---------- */
const rest = { left: 0, total: 90, t: null, hideT: null };
function startRest() {
  clearInterval(rest.t); clearTimeout(rest.hideT);
  rest.total = 90; rest.left = 90;
  const el = $('#rest');
  el.innerHTML = '<span class="lbl" id="rest-lbl">Rest</span><span class="t" id="rest-t">1:30</span>' +
    '<button class="plus" id="rest-plus" data-act="rest-plus">+30 s</button>' +
    '<button id="rest-close" data-act="rest-close" aria-label="Hide rest timer">' + ic('x', 'sm') + '</button><span class="bar" id="rest-bar"></span>';
  el.hidden = false;
  document.body.classList.add("resting");
  tickRest();
  rest.t = setInterval(() => {
    rest.left--;
    tickRest();
    if (rest.left <= 0) {
      clearInterval(rest.t); rest.t = null;
      $('#rest-lbl').textContent = 'Rest done';
      const p = $('#rest-plus'); if (p) p.hidden = true;
      rest.hideT = setTimeout(() => { $('#rest').hidden = true; document.body.classList.remove('resting'); }, 2500);
    }
  }, 1000);
}
function tickRest() {
  const l = Math.max(rest.left, 0);
  const t = $('#rest-t'), b = $('#rest-bar');
  if (t) t.textContent = Math.floor(l / 60) + ':' + pad(l % 60);
  if (b) b.style.width = (rest.total ? l / rest.total * 100 : 0) + '%';
}
function stopRest() { clearInterval(rest.t); clearTimeout(rest.hideT); rest.t = null; $('#rest').hidden = true; document.body.classList.remove('resting'); }

  if (allDone && !wasDone) S.gym.justDone[exId] = true;
  renderGym(); S.gym.popKey = null;
  if (allDone && !wasDone) {
    setTimeout(() => { delete S.gym.justDone[exId]; renderGym(); }, reduced() ? 0 : 750);
  }
  if (gymProgress().finished) {
    stopRest();
    setTimeout(() => { const sm = $('#summary'); if (sm) sm.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); }, reduced() ? 0 : 800);
  } else if (!wasDone) startRest();

const SUBJ = [[/^(math|maths)$/, 'Math'], [/^(bio|biology)$/, 'Biology'], [/^(eng|english)$/, 'English'], [/^(hist|history)$/, 'History'],
  [/^(phys|physics)$/, 'Physics'], [/^(heb|hebrew)$/, 'Hebrew'], [/^(chem|chemistry)$/, 'Chemistry'], [/^(lit|literature)$/, 'Literature'],
  [/^(cs|code|computer)$/, 'Computer science'], [/^(civics)$/, 'Civics'], [/^(bible|tanakh|tanach)$/, 'Bible'], [/^(geo|geography)$/, 'Geography']];
const TYPES = [[/^(hw|homework|ex|exercise|exercises)$/, 'Homework'], [/^(test|exam|bagrut)$/, 'Test'], [/^(quiz)$/, 'Quiz'], [/^(essay)$/, 'Essay'],
  [/^(read|reading)$/, 'Reading'], [/^(project|proj)$/, 'Project'], [/^(presentation|pres)$/, 'Presentation']];
const DAYS = { sun: 0, sunday: 0, mon: 1, monday: 1, tue: 2, tues: 2, tuesday: 2, wed: 3, weds: 3, wednesday: 3, thu: 4, thur: 4, thurs: 4, thursday: 4, fri: 5, friday: 5, sat: 6, saturday: 6 };
const SHORT_SUBJ = { Biology: 'Bio', 'Computer science': 'CS' };
function parseHw(text) {
  const words = text.toLowerCase().replace(/[.,!?]/g, ' ').split(/\s+/).filter(Boolean);
  let subj = null, type = null, off = null, newSubj = false;
  const rest = [];
  words.forEach(w => {
    let m;
    if (!subj && (m = SUBJ.find(s => s[0].test(w)))) { subj = m[1]; return; }
    if (!type && (m = TYPES.find(t => t[0].test(w)))) { type = m[1]; return; }
    if (off == null && Object.prototype.hasOwnProperty.call(DAYS, w)) { off = ((DAYS[w] - BASE.getDay()) + 7) % 7 || 7; return; }
    if (off == null && w === 'today') { off = 0; return; }
    if (off == null && (w === 'tomorrow' || w === 'tmr' || w === 'tmrw')) { off = 1; return; }
    rest.push(w);
  });
  if (!subj && type && rest.length) { subj = cap(rest.shift()); newSubj = true; }
  if (!subj && !type && off == null) return null;
  type = type || 'Homework';
  subj = subj || 'General';
  const short = (SHORT_SUBJ[subj] || subj) + ' ' + (type === 'Homework' ? 'hw' : type.toLowerCase());
  return { subj: subj, type: type, off: off, newSubj: newSubj, short: short, title: subj + ' ' + type.toLowerCase() + (rest.length ? ' ' + rest.join(' ') : '') };
}

const NUMW = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, half: 0.5 };
function parseFood(text) {
  const t = text.toLowerCase().replace(/chicken\s+(and|&|with)\s+rice/g, 'chickenrice');
  const segs = t.split(/\s*(?:,|\band\b|\bwith\b|\+|&)\s*/).map(s => s.trim()).filter(Boolean);
  return segs.map(seg => {
    const words = seg.split(/\s+/);
    let qty = 1;
    if (/^\d+(\.\d+)?$/.test(words[0])) qty = parseFloat(words.shift());
    else if (NUMW[words[0]] != null) qty = NUMW[words.shift()];
    let item = null;
    for (const k in LIB) { if (LIB[k].keys.some(kw => words.indexOf(kw) >= 0)) { item = LIB[k]; break; } }
    if (!item) return { name: cap(words.join(' ') || seg), kcal: Math.round(200 * qty), p: Math.round(8 * qty), c: Math.round(20 * qty), f: Math.round(9 * qty), guess: true };
    const name = qty === 1 ? item.name : qty + ' ' + (item.pl || item.name.toLowerCase());
    return { name: cap(name), kcal: Math.round(item.kcal * qty), p: Math.round(item.p * qty), c: Math.round(item.c * qty), f: Math.round(item.f * qty), guess: false };
  });
}

    '<button class="menu-item" id="st-commute" data-act="sheet" data-sheet="commute">' + ic('train') + 'School week & commute<span class="r">Sun–Thu</span></button>' +
    '<button class="menu-item" id="st-water" data-act="sheet" data-sheet="water">' + ic('drop') + 'Water bottle size<span class="r">' + bottleLabel(S.water.bottle) + '</span></button></div>' +
    '<p class="group-title">More pages</p><p class="pages-cap">Hidden, not deleted. Your data is kept.</p><div class="menu-list">' +
    ARCHIVED.map(p => '<button class="menu-item" id="pg-' + p.toLowerCase() + '" data-act="demo" data-msg="' + p + ' opens here in the real app">' + p + '<span class="r">Open</span></button>').join('') + '</div>' +
    '<p class="group-title">Account</p><div class="menu-list">' +
    '<button class="menu-item" id="st-export" data-act="demo" data-msg="Export ready (demo)">' + ic('export') + 'Export my data</button>' +
    '<div class="menu-item static">' + ic('info') + 'About<span class="r">Version 3.0 · mockup</span></div>' +
    '<button class="menu-item" id="st-logout" data-act="logout">' + ic('logout') + 'Log out</button></div>' +
    (S.confirmLogout ? '<div class="confirm"><p>Log out on this phone? Your data stays in your account.</p><div class="sheet-actions"><button class="btn ghost" id="lo-cancel" data-act="logout-cancel">Cancel</button><button class="btn primary" id="lo-yes" data-act="demo" data-msg="Logged out (demo)">Log out</button></div></div>' : '')
});

/* ================= Actions ================= */
const ACT = {
  nav: el => { closeSheet(); go(el.dataset.view); },
  settings: () => openSheet('settings'),
  sheet: el => openSheet(el.dataset.sheet, Object.assign({}, el.dataset)),
  'sheet-close': () => closeSheet(),
  undo: () => { const u = toastUndo; hideToast(); if (u) u(); },
  demo: el => { closeSheet(); toast(el.dataset.msg); },
  theme: el => setTheme(el.dataset.v),
  logout: () => { S.confirmLogout = true; renderSheet(); },
  'logout-cancel': () => { S.confirmLogout = false; renderSheet(); },

  'water-add': () => addWater(),
  'water-undo': () => undoWater(),
  bottle: el => { S.water.bottle = +el.dataset.v; renderSheet(); renderWater(); },

  'todo-day': el => { S.todo.day = el.dataset.day; renderTodo(); },
  'task-toggle': el => toggleTask(+el.dataset.id),
  'task-menu': el => openSheet('task', { id: el.dataset.id }),
  'task-pin': el => { const x = S.tasks.find(t => t.id === +el.dataset.id); if (x) x.pinned = !x.pinned; closeSheet(); renderTodo(); },
  'task-move': el => {
    const x = S.tasks.find(t => t.id === +el.dataset.id); if (!x) return;
    const from = x.day; x.day = from === 'today' ? 'tomorrow' : 'today';
    closeSheet(); renderTodo(); renderHeroTiles();
    toast('Moved to ' + x.day, () => { x.day = from; renderTodo(); renderHeroTiles(); });
  },
  'task-del': el => {
    const i = S.tasks.findIndex(t => t.id === +el.dataset.id); if (i < 0) return;
    const x = S.tasks.splice(i, 1)[0];
    closeSheet(); renderTodo(); renderHeroTiles();
    toast('Deleted “' + x.text + '”', () => { S.tasks.splice(i, 0, x); renderTodo(); renderHeroTiles(); });
  },
  'toggle-done': () => { S.todo.showDone = !S.todo.showDone; renderTodo(); },
  'toggle-later': () => { S.todo.showLater = !S.todo.showLater; renderTodo(); },
  'older-review': () => openSheet('older'),
  'older-keep': () => {
    const added = S.older.items.map(t => { const x = { id: ++S.todo.seq, text: t, day: 'later' }; S.tasks.push(x); return x.id; });
    S.older.state = 'kept'; closeSheet(); renderTodo();
    toast('Moved ' + added.length + ' tasks to Later', () => { S.tasks = S.tasks.filter(t => added.indexOf(t.id) < 0); S.older.state = 'pending'; renderTodo(); });
  },
  'older-clear': () => {
    S.older.state = 'cleared'; closeSheet(); renderTodo();
    toast('Cleared ' + S.older.items.length + ' older tasks', () => { S.older.state = 'pending'; renderTodo(); });
  },

  'day-pick': () => openSheet('day'),
  'day-set': el => { S.gym.day = el.dataset.day; S.gym.open = {}; closeSheet(); renderGym(); renderHeroTiles(); },
  'gym-menu': () => openSheet('gymmenu'),
  'ex-menu': el => openSheet('exmenu', { ex: el.dataset.ex }),
  'ex-open': el => { S.gym.open[el.dataset.ex] = true; renderGym(); },
  'ex-close': el => { delete S.gym.open[el.dataset.ex]; renderGym(); },
  'ex-adjust': el => { const arr = sess()[el.dataset.ex]; const i = Math.max(0, arr.findIndex(x => !x.done)); openSheet('set', { ex: el.dataset.ex, i: i }); },
  pill: el => logPill(el.dataset.ex, +el.dataset.i),
  'set-w': el => { const a = sheetArg, ex = exById(a.ex); a.w = Math.max(0, Math.round((a.w + (+el.dataset.d) * ex.step) * 10) / 10); renderSheet(); },
  'set-r': el => { sheetArg.r = +el.dataset.r; renderSheet(); },
  'set-save': () => {
    const a = sheetArg, arr = sess()[a.ex], x = arr[a.i], wasDone = x.done;
    x.w = a.w; x.r = a.r; x.done = true;
    arr.forEach((y, j) => { if (j > a.i && !y.done) y.w = a.w; });
    S.gym.popKey = a.ex + ':' + a.i;
    closeSheet(); afterLog(a.ex, wasDone);
  },
  'set-unlog': () => { const a = sheetArg; sess()[a.ex][a.i].done = false; closeSheet(); renderGym(); renderHeroTiles(); },
  'rest-plus': () => { rest.left += 30; rest.total = Math.max(rest.total, rest.left); tickRest(); },
  'rest-close': () => stopRest(),
  'gym-finish-all': () => {
    const s = sess(); Object.keys(s).forEach(k => s[k].forEach(x => { x.done = true; }));
    S.gym.open = {}; stopRest(); renderGym(); renderHeroTiles(); window.scrollTo(0, 0);
  },
  'gym-reset': () => { delete S.gym.sess[S.gym.day]; S.gym.open = {}; renderGym(); renderHeroTiles(); window.scrollTo(0, 0); },
  'weigh-step': el => { sheetArg.w = Math.round((sheetArg.w + (+el.dataset.d) * 0.1) * 10) / 10; renderSheet(); },
  'weigh-save': () => { S.weight = sheetArg.w; closeSheet(); toast('Saved · ' + fw(S.weight) + ' kg'); },
  'addex-save': () => {
    const v = ($('#addex-name').value || '').trim(); if (!v) { $('#addex-name').focus(); return; }
    S.gym.plans[S.gym.day].push({ id: 'x' + (++S.todo.seq), name: cap(v), w: 20, r: 10, step: 2.5, last: { w: 20, reps: [10, 10, 10] } });
    closeSheet(); renderGym(); renderHeroTiles(); toast('Added ' + cap(v) + ' to ' + S.gym.day);
  },

  'alt-pick': el => { S.commute.pick = +el.dataset.t; renderCommute(); renderHeroTiles(); },
  'alt-back': el => { S.commute.pickBack = +el.dataset.t; renderCommute(); renderHeroTiles(); },
  'cm-step': el => { const k = el.dataset.k; S.commute[k] = clamp(S.commute[k] + (+el.dataset.d), 0, 90); renderSheet(); renderCommute(); renderHeroTiles(); },
  'cm-start': el => { const d = el.dataset.day; S.commute.start[d] = clamp(S.commute.start[d] + (+el.dataset.d) * 5, tm('07:00'), tm('10:00')); renderSheet(); renderCommute(); renderHeroTiles(); },
  'cm-off': () => { S.commute.off = !S.commute.off; renderSheet(); renderCommute(); renderHeroTiles(); },
  'hw-toggle': el => toggleHw(+el.dataset.id),
  'score-step': el => { sheetArg.v = clamp(sheetArg.v + (+el.dataset.d), 0, 100); renderSheet(); },
  'score-pick': el => { sheetArg.v = +el.dataset.v; renderSheet(); },
  'score-save': () => {
    const x = S.school.items.find(i => i.id === +sheetArg.id), prevG = S.school.grades[x.subj];
    x.score = sheetArg.v; S.school.grades[x.subj] = sheetArg.v;
    closeSheet(); renderUpNext();
    toast('Saved · ' + x.subj + ' ' + x.score, () => { x.score = null; S.school.grades[x.subj] = prevG; renderUpNext(); });
  },
  grades: () => openSheet('grades'),

  'food-day': el => { S.food.day = Math.min(0, S.food.day + (+el.dataset.dir)); S.food.ai = null; renderFood(); },
  qchip: el => { const f = LIB[el.dataset.k]; const u = addEntries([f], mealNow()); toast('Added ' + f.name + ' · ' + f.kcal + ' kcal', u); },
  'ai-cancel': () => { S.food.ai = null; renderAi(); },
  'ai-addall': () => {
    const a = S.food.ai; if (!a || !a.items) return;
    S.food.ai = null; $('#ai-input').value = '';
    const u = addEntries(a.items, a.meal);
    toast('Added ' + a.items.length + ' ' + plural(a.items.length, 'item', 'items') + ' to ' + a.meal, u);
  },
  'copy-yday': () => {
    const y = foodEntries(S.food.day - 1);
    if (!y.length) { toast('Nothing to copy from yesterday'); return; }
    const list = foodEntries(S.food.day), ids = [];
    y.forEach(e => { const id = ++S.food.seq; ids.push(id); list.push(Object.assign({}, e, { id: id })); });
    renderFood(); renderHeroTiles();
    toast('Copied ' + y.length + ' items from yesterday', () => { S.food.days[String(S.food.day)] = foodEntries(S.food.day).filter(e => ids.indexOf(e.id) < 0); renderFood(); renderHeroTiles(); });
  },
  'lib-add': el => { const f = LIB[el.dataset.k]; const u = addEntries([f], mealNow()); toast('Added ' + f.name, u); },
  'entry-q': el => { sheetArg.q = clamp(sheetArg.q + (+el.dataset.d) * 0.5, 0.5, 4); renderSheet(); },
  'entry-done': () => {
    const e = foodEntries(S.food.day).find(x => x.id === +sheetArg.id), q = sheetArg.q;
    if (e && q !== 1) { e.kcal = Math.round(e.kcal * q); e.p = Math.round(e.p * q); e.c = Math.round(e.c * q); e.f = Math.round(e.f * q); }
    closeSheet(); renderFood(); renderHeroTiles();
  },
  'entry-del': () => {
    const list = foodEntries(S.food.day), i = list.findIndex(x => x.id === +sheetArg.id); if (i < 0) return;
    const e = list.splice(i, 1)[0];
    closeSheet(); renderFood(); renderHeroTiles();
    toast('Removed ' + e.name, () => { foodEntries(S.food.day).splice(i, 0, e); renderFood(); renderHeroTiles(); });
  }
};

/* ================= Long press ================= */
let lp = null, suppressClick = false, lastLp = 0;
function longPress(el) {
  lastLp = Date.now();
  const k = el.dataset.lp;
  if (k === 'task-menu') openSheet('task', { id: el.dataset.id });
  else if (k === 'pill-adjust') openSheet('set', { ex: el.dataset.ex, i: +el.dataset.i });
  else if (k === 'water-sheet') openSheet('water');
}
function cancelLp() { if (lp) { clearTimeout(lp.t); lp.el.classList.remove('pressing'); lp = null; } }
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-lp]');
  if (!el || e.button > 0) return;
  cancelLp();
  lp = {
    el: el, x: e.clientX, y: e.clientY,
    t: setTimeout(() => {
      el.classList.remove('pressing');
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 700);
      try { if (navigator.vibrate) navigator.vibrate(8); } catch (_) {}
      lp = null; longPress(el);
    }, 480)
  };
  if (el.classList.contains('task')) el.classList.add('pressing');
});
document.addEventListener('pointermove', e => { if (lp && (Math.abs(e.clientX - lp.x) > 10 || Math.abs(e.clientY - lp.y) > 10)) cancelLp(); });
document.addEventListener('pointerup', cancelLp);
document.addEventListener('pointercancel', cancelLp);
document.addEventListener('contextmenu', e => {
  const el = e.target.closest('[data-lp]');
  if (!el) return;
  e.preventDefault(); cancelLp();
  if (Date.now() - lastLp > 800) longPress(el);
});

/* ================= Wiring ================= */
document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetKind) closeSheet(); });

$('#todo-form').addEventListener('submit', e => {
  e.preventDefault();
  const inp = $('#todo-input'), v = inp.value.trim();
  if (!v) return;
  addTask(v); inp.value = ''; inp.focus();
});
$('#hw-input').addEventListener('input', renderHwPreview);
$('#hw-form').addEventListener('submit', e => {
  e.preventDefault();
  const inp = $('#hw-input'), v = inp.value.trim();
  if (!v) return;
  const p = parseHw(v) || { subj: 'General', type: 'Homework', off: null, title: cap(v), short: cap(v) };
  const item = { id: ++S.school.seq, title: cap(p.title), short: p.short, subj: p.subj, type: p.type, off: p.off, newSubj: p.newSubj, isNew: true };
  S.school.items.push(item);
  inp.value = ''; renderHwPreview(); renderUpNext(); renderHeroTiles();
  toast('Added · ' + item.title + (item.off != null ? ', ' + dow(item.off) : ''), () => { S.school.items = S.school.items.filter(i => i !== item); renderUpNext(); renderHeroTiles(); });
});
$('#ai-form').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#ai-input').value.trim();
  if (!v) return;
  S.food.ai = { state: 'thinking' }; renderAi();
  setTimeout(() => { S.food.ai = { state: 'done', items: parseFood(v), meal: mealNow() }; renderAi(); }, reduced() ? 0 : 700);
});
$('#food-search').addEventListener('input', renderSearch);
$('#qa-form').addEventListener('submit', e => {
  e.preventDefault();
  const k = parseInt($('#qa-kcal').value, 10), p = parseInt($('#qa-prot').value, 10) || 0;
  if (!k) { $('#qa-kcal').focus(); toast('Add the calories first'); return; }
  const u = addEntries([{ name: 'Quick add', kcal: k, p: p, c: 0, f: 0 }], mealNow());
  $('#qa-kcal').value = ''; $('#qa-prot').value = '';
  toast('Added ' + k + ' kcal', u);
});
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'set-name') {
    S.name = e.target.value; renderHeader();
    const av = $('#set-av'); if (av) av.textContent = (S.name.trim() || '?').charAt(0).toUpperCase();
  }
});

/* ================= Wrapper messages + clock ================= */
window.addEventListener('message', e => {
  const m = e.data || {};
  if (m.type === 'theme') setTheme(m.value);
  else if (m.type === 'time' && PRESETS[m.value] != null) {
    S.preset = m.value; S.now = PRESETS[m.value];
    S.commute.pick = null; S.commute.pickBack = null;
    renderAll();
  }
});
setInterval(() => {
  S.now = Math.min(S.now + 1, 1439);
  renderHeader(); renderHeroTiles(); renderCommute();
}, 60000);

/* ================= Boot ================= */
S.weight = 68.4;
const start = VIEWS.indexOf((location.hash || '').slice(1)) >= 0 ? location.hash.slice(1) : 'today';
VIEWS.forEach(v => { if (v !== start) renderView(v); });
go(start);
})();
</script>
</body>
</html>
