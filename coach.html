<style>
:root{
  --bg:#050506; --bg-card:rgba(255,255,255,0.045); --border:rgba(255,255,255,0.09);
  --text-1:#fafafa; --text-2:rgba(255,255,255,0.62); --text-3:rgba(255,255,255,0.4);

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text-2);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
main{max-width:720px;margin:0 auto;padding:14px 16px calc(150px + env(safe-area-inset-bottom));}
.co-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 4px;}
.co-title{font-size:24px;font-weight:800;letter-spacing:-0.4px;color:var(--text-1);}

.co-new{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text-2);

.co-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.co-chip{background:color-mix(in srgb,var(--accent,#a78bfa) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--accent,#a78bfa) 28%,transparent);
  color:var(--text-1);border-radius:18px;padding:8px 13px;font-family:inherit;font-size:12.5px;font-weight:600;
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s;}
.co-chip:active{transform:scale(.97);}
.co-chat{display:grid;gap:10px;}
.co-bub{padding:11px 14px;border-radius:15px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.co-bub.me{background:color-mix(in srgb,var(--accent,#a78bfa) 20%,transparent);
  border:1px solid color-mix(in srgb,var(--accent,#a78bfa) 32%,transparent);
  color:var(--text-1);justify-self:end;max-width:86%;}
.co-bub.ai{background:var(--bg-card);border:1px solid var(--border);color:var(--text-2);justify-self:start;max-width:92%;}
.co-bub.ai.thinking{color:var(--text-3);font-style:italic;}
.co-inputbar{
  position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:45;
  padding:10px 16px;background:linear-gradient(to top,rgba(5,5,6,0.97) 70%,transparent);
}
.co-inputbar-inner{max-width:720px;margin:0 auto;display:flex;gap:8px;}
.co-input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);
  border-radius:14px;color:var(--text-1);font-family:inherit;font-size:16px;padding:13px 15px;outline:none;}
.co-input:focus{border-color:var(--accent,#a78bfa);}
.co-send{width:50px;border:none;border-radius:14px;background:var(--accent,#a78bfa);color:#fff;
  font-size:18px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.co-send:disabled{opacity:.5;}
.co-status{font-size:11px;color:var(--text-3);text-align:center;margin-top:6px;}
</style>

<script>
(function(){
'use strict';

function client(){if(!sb)sb=window.supabase.createClient(SB_URL,SB_KEY);return sb;}

// ── chat persistence (local; the account guard wipes it on account switch) ──

function bubble(role,text,thinking){
  const d=document.createElement('div');
  d.className='co-bub '+(role==='user'?'me':'ai')+(thinking?' thinking':'');

  }
  history.forEach(m=>bubble(m.role,m.text));
}

// ── context: fetch everything once per send, prune blobs, summarize ──
function prune(v,depth){
  depth=depth||0;
  if(depth>6)return undefined;
  if(typeof v==='string')return v.length>400?v.slice(0,120)+'…[trimmed]':v;
  if(typeof v==='number'||typeof v==='boolean'||v===null)return v;
  if(Array.isArray(v)){
    const a=v.length>30?v.slice(-30):v;
    return a.map(x=>prune(x,depth+1)).filter(x=>x!==undefined);
  }
  if(typeof v==='object'){
    const o={};
    Object.keys(v).forEach(k=>{
      if(k==='_pushAt'||k==='_localAt')return;
      if(/photo|dataUrl|image/i.test(k))return;          // never ship images/base64
      const p=prune(v[k],depth+1);
      if(p!==undefined)o[k]=p;
    });
    return o;
  }
  return undefined;
}
async function fetchRows(){
  try{await client().auth.getSession();}catch(e){}
  const{data}=await client().from('app_state').select('key,data').like('key',uid+':%');
  const map={};
  (data||[]).forEach(r=>{map[r.key.slice(uid.length+1)]=r.data||{};});
  return map;
}
function dk(offset){const d=new Date();d.setDate(d.getDate()-offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function buildContext(m){
  const health=m['health']||{},gym=m['po-coach']||{},habits=m['habits']||{},dash=m['dashboard']||{},settings=m['settings']||{};
  const ctx={today:dk(0)};
  try{ctx.user={name:settings.name||null,mode:settings.mode||'adult'};}catch(e){}
  // body weight (canonical store lives in the health row since v2.5.39)
  try{
    const w=(health['po_coach_weights']||gym['po_coach_weights']||[]).slice(-21);
    ctx.bodyWeightLog=w;
  }catch(e){}
  // nutrition
  try{
    ctx.nutrition={
      coachProfile:health['dashboard:mealPrep:v1:coach']||null,
      targets:health['dashboard:mealPrep:v1:settings']||null,
      mealPlan:(health['dashboard:mealPrep:v1:template']||[]).map(x=>({name:x.name,foods:x.foods,kcal:x.kcal,protein:x.protein,carbs:x.carbs,fat:x.fat})),
      last14dLogs:{}
    };
    const daily=health['dashboard:mealPrep:v1:daily']||{};
    for(let i=0;i<14;i++){const k=dk(i);if(daily[k])ctx.nutrition.last14dLogs[k]=prune(daily[k],3);}
  }catch(e){}
  // water
  try{
    const w=health['po_water_v1']||{};
    const logs={};for(let i=0;i<7;i++){const k=dk(i);if(w.logs&&w.logs[k]!=null)logs[k]=w.logs[k];}
    ctx.water={profile:w.profile||null,mlLast7Days:logs};
  }catch(e){}
  // sleep
  try{ctx.sleepLast14=((health['dashboard:sleep:v1']||{}).entries||[]).slice(-14);}catch(e){}
  // gym
  try{
    ctx.gym={
      plan:(gym['dashboard:gym:v1:template']||[]).map(d=>({day:d.name,exercises:(d.exercises||[]).map(e=>({name:e.name,sets:e.sets,reps:e.repMin+'-'+e.repMax,target:e.target,toFailureSets:e.failSets||0}))})),
      last14dWorkouts:{}
    };
    const logs=gym['dashboard:gym:v1:logs']||{};
    for(let i=0;i<14;i++){const k=dk(i);if(logs[k])ctx.gym.last14dWorkouts[k]=prune(logs[k],3);}
  }catch(e){}
  // habits + main dashboard (mood/goals) — generic pruned copies
  try{ctx.habits=prune(habits,1);}catch(e){}
  try{ctx.dashboardHome=prune(dash,1);}catch(e){}
  // keep the whole thing bounded
  let s=JSON.stringify(ctx);
  if(s.length>26000){try{delete ctx.dashboardHome;}catch(e){}}
  s=JSON.stringify(ctx);
  if(s.length>26000){try{delete ctx.habits;}catch(e){}}
  return ctx;
}

// ── writing to the dashboard: patch a cloud row (merge-safe) ──
async function patchRow(base, mutate){
  const key=uid+':'+base;
  const {data}=await client().from('app_state').select('data').eq('key',key).maybeSingle();
  const row=(data&&data.data&&typeof data.data==='object')?data.data:{};
  mutate(row);
  row._pushAt=Date.now();
  await client().from('app_state').upsert({key:key,data:row,updated_at:new Date().toISOString()},{onConflict:'key'});
}
const MEAL_TPL='dashboard:mealPrep:v1:template', MEAL_SET='dashboard:mealPrep:v1:settings', GYM_TPL='dashboard:gym:v1:template';
const rid=p=>p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
function findDay(tpl,name){name=(name||'').toLowerCase();return tpl.find(d=>(d.name||'').toLowerCase()===name)||tpl.find(d=>(d.name||'').toLowerCase().includes(name)||name.includes((d.name||'').toLowerCase()));}
function findEx(day,name){name=(name||'').toLowerCase();const ex=day.exercises||[];return ex.find(e=>(e.name||'').toLowerCase()===name)||ex.find(e=>(e.name||'').toLowerCase().includes(name)||name.includes((e.name||'').toLowerCase()));}

// Human-readable summary of a proposed change (shown before Apply).
function describe(name,a){
  if(name==='set_nutrition_targets')return `Set targets → ${a.kcal_min}-${a.kcal_max} kcal · ${a.protein_min}-${a.protein_max}P · ${a.carbs_min}-${a.carbs_max}C · ${a.fat_min}-${a.fat_max}F`;
  if(name==='replace_meal_plan')return `Replace meal plan with ${(a.meals||[]).length} meals:\n`+(a.meals||[]).map(m=>`• ${m.name} — ${m.foods} (${m.kcal} kcal, ${m.protein}P)`).join('\n');
  if(name==='add_meal')return `Add meal: ${a.name} — ${a.foods} (${a.kcal} kcal, ${a.protein}P)`;
  if(name==='set_gym_exercise'){const f=[];if(a.sets!=null)f.push(a.sets+' sets');if(a.rep_min!=null||a.rep_max!=null)f.push((a.rep_min||'?')+'-'+(a.rep_max||'?')+' reps');if(a.target!=null)f.push('target '+a.target);if(a.fail_sets!=null)f.push(a.fail_sets+' to failure');return `Update ${a.exercise_name} (${a.day_name}) → ${f.join(', ')||'no change'}`;}
  if(name==='add_gym_exercise')return `Add ${a.name} to ${a.day_name} → ${a.sets}×${a.rep_min}-${a.rep_max}${a.target?' @ '+a.target:''}`;
  if(name==='set_water_setup'){const f=[];if(a.weight_kg!=null)f.push(a.weight_kg+'kg');if(a.age!=null)f.push('age '+a.age);if(a.sex!=null)f.push(a.sex==='f'?'female':'male');if(a.activity_hours_per_week!=null)f.push(a.activity_hours_per_week+'h/wk');if(a.cup_ml!=null)f.push('cup '+a.cup_ml+'ml');if(a.bottle_ml!=null)f.push('bottle '+a.bottle_ml+'ml');if(a.big_bottle_ml!=null)f.push('big '+a.big_bottle_ml+'ml');return 'Set water setup → '+(f.join(', ')||'no change');}
  return name;
}
// Actually apply an approved tool call. Returns a result string for the model.
async function applyAction(name,a){
  if(name==='set_nutrition_targets'){
    await patchRow('health',row=>{row[MEAL_SET]={kcal:{min:a.kcal_min,max:a.kcal_max},protein:{min:a.protein_min,max:a.protein_max},carbs:{min:a.carbs_min,max:a.carbs_max},fat:{min:a.fat_min,max:a.fat_max}};});
    return 'Done — targets updated.';
  }
  if(name==='replace_meal_plan'){
    await patchRow('health',row=>{row[MEAL_TPL]=(a.meals||[]).map(m=>({id:rid('mp'),name:m.name,foods:m.foods||'',kcal:Math.round(m.kcal)||0,protein:Math.round(m.protein)||0,carbs:Math.round(m.carbs)||0,fat:Math.round(m.fat)||0,notes:'AI Coach'}));});
    return 'Done — meal plan replaced ('+(a.meals||[]).length+' meals).';
  }
  if(name==='add_meal'){
    await patchRow('health',row=>{const t=Array.isArray(row[MEAL_TPL])?row[MEAL_TPL]:[];t.push({id:rid('mp'),name:a.name,foods:a.foods||'',kcal:Math.round(a.kcal)||0,protein:Math.round(a.protein)||0,carbs:Math.round(a.carbs)||0,fat:Math.round(a.fat)||0,notes:'AI Coach'});row[MEAL_TPL]=t;});
    return 'Done — meal added.';
  }
  if(name==='set_gym_exercise'){
    let msg='exercise not found';
    await patchRow('po-coach',row=>{const tpl=Array.isArray(row[GYM_TPL])?row[GYM_TPL]:[];const d=findDay(tpl,a.day_name);if(!d)return;const e=findEx(d,a.exercise_name);if(!e)return;if(a.sets!=null)e.sets=a.sets;if(a.rep_min!=null)e.repMin=a.rep_min;if(a.rep_max!=null)e.repMax=a.rep_max;if(a.target!=null)e.target=a.target;if(a.fail_sets!=null)e.failSets=a.fail_sets;row[GYM_TPL]=tpl;msg='Done — '+e.name+' updated.';});
    return msg;
  }
  if(name==='add_gym_exercise'){
    let msg='day not found';
    await patchRow('po-coach',row=>{const tpl=Array.isArray(row[GYM_TPL])?row[GYM_TPL]:[];const d=findDay(tpl,a.day_name);if(!d)return;d.exercises=d.exercises||[];d.exercises.push({id:rid('ex'),name:a.name,sets:a.sets||3,repMin:a.rep_min||8,repMax:a.rep_max||12,target:a.target||'',step:null,failSets:a.fail_sets||0,bw:!!a.bodyweight,unilateral:!!a.unilateral,notes:''});row[GYM_TPL]=tpl;msg='Done — '+a.name+' added to '+d.name+'.';});
    return msg;
  }
  if(name==='set_water_setup'){
    await patchRow('health',row=>{const w=(row['po_water_v1']&&typeof row['po_water_v1']==='object')?row['po_water_v1']:{};w.profile=w.profile||{};w.sizes=w.sizes||{cup:250,bottle:500,big:1000};if(a.weight_kg!=null)w.profile.weightKg=a.weight_kg;if(a.age!=null)w.profile.age=a.age;if(a.sex!=null)w.profile.sex=a.sex;if(a.activity_hours_per_week!=null)w.profile.activityHrsPerWeek=a.activity_hours_per_week;if(a.cup_ml!=null)w.sizes.cup=a.cup_ml;if(a.bottle_ml!=null){w.sizes.bottle=a.bottle_ml;w.bottleMl=a.bottle_ml;}if(a.big_bottle_ml!=null)w.sizes.big=a.big_bottle_ml;w._setup=true;row['po_water_v1']=w;});
    return 'Done — water setup updated.';
  }
  return 'Unknown action.';
}
// Inline Apply/Skip card; resolves true/false.
function confirmCard(name,a){
  return new Promise(resolve=>{
    const card=document.createElement('div');
    card.className='co-bub ai';
    card.style.borderColor='color-mix(in srgb,var(--accent,#a78bfa) 45%,transparent)';
    card.innerHTML='<div style="font-weight:700;color:var(--text-1);margin-bottom:6px">🔧 Proposed change</div>'
      +'<div style="white-space:pre-wrap;margin-bottom:10px">'+describe(name,a).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div>'
      +'<div style="display:flex;gap:8px"><button class="co-send" style="width:auto;padding:8px 16px;font-size:14px" data-ok>✓ Apply</button>'
      +'<button class="co-new" data-no>✗ Skip</button></div>';
    $('coChat').appendChild(card);card.scrollIntoView({block:'end'});
    card.querySelector('[data-ok]').addEventListener('click',()=>{card.querySelectorAll('button').forEach(b=>b.disabled=true);card.querySelector('[data-ok]').textContent='✓ Applied';resolve(true);});
    card.querySelector('[data-no]').addEventListener('click',()=>{card.querySelectorAll('button').forEach(b=>b.disabled=true);card.querySelector('[data-no]').textContent='Skipped';resolve(false);});
  });
}

let apiMsgs=[]; // Anthropic-format running conversation (text + tool_use/tool_result)
// The server verifies this token to decide whether this account is allowed to
// spend the owner's AI credit — so it must be the real session token, not a uid.
async function authToken(){
  try{const{data}=await client().auth.getSession();return (data&&data.session&&data.session.access_token)||'';}catch(e){return '';}
}
async function callCoach(ctx){
  const r=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({context:ctx,messages:apiMsgs,token:await authToken()})});
  return r.json();
}
async function ask(q){
  if(!q)return;
  $('coIn').value='';
  bubble('user',q);
  history.push({role:'user',text:q});saveChat(history);
  apiMsgs.push({role:'user',content:q});
  $('coSend').disabled=true;
  $('coStatus').textContent='Reading your data…';
  const t=bubble('assistant','Thinking…',true);
  try{
    rows=await fetchRows();
    const ctx=buildContext(rows);
    let first=true,guard=0,changed=false;
    while(guard++<6){
      $('coStatus').textContent=first?'Coaching…':'Working…';
      const j=await callCoach(ctx);
      if(!j.ok){
        const msg=j.error==='no-key'
          ?'⚙️ The AI coach isn\'t switched on yet — add your API key in Vercel (Settings → Environment Variables) and redeploy.'
          :(j.message||('Couldn\'t answer ('+(j.error||'error')+'). Try again in a moment.'));
        if(first){t.classList.remove('thinking');t.textContent=msg;}else bubble('assistant',msg);
        break;
      }
      // record assistant turn (raw content blocks) for the running api conversation
      apiMsgs.push({role:'assistant',content:j.content});
      const txt=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
      if(txt){ if(first){t.classList.remove('thinking');t.textContent=txt;} else bubble('assistant',txt); history.push({role:'assistant',text:txt});saveChat(history); }
      else if(first){ t.remove(); }
      first=false;
      const toolUses=(j.content||[]).filter(b=>b.type==='tool_use');
      if(!toolUses.length) break;               // no actions → done
      // confirm + execute each tool, collect results
      const results=[];
      for(const tu of toolUses){
        const ok=await confirmCard(tu.name,tu.input);
        let result;
        if(ok){ try{ result=await applyAction(tu.name,tu.input); changed=true; }catch(e){ result='Failed: '+e.message; } }
        else result='User skipped this change.';
        results.push({type:'tool_result',tool_use_id:tu.id,content:result});
      }
      apiMsgs.push({role:'user',content:results});
      // loop → model comments on the results / continues
    }
    if(changed){ if(rows)rows=null; bubble('assistant','✅ Changes saved — open the relevant page to see them (they sync to your other devices too).'); }
    // trim running conversation so it can't grow unbounded
    if(apiMsgs.length>24)apiMsgs=apiMsgs.slice(-24);
  }catch(e){
    t.textContent='No connection to the coach — check your internet and try again.';
  }
  $('coStatus').textContent='';
  $('coSend').disabled=false;
  $('coChat').lastElementChild&&$('coChat').lastElementChild.scrollIntoView({block:'end'});
}

$('coSend').addEventListener('click',()=>ask(($('coIn').value||'').trim()));
$('coIn').addEventListener('keydown',e=>{if(e.key==='Enter')ask(($('coIn').value||'').trim());});
document.querySelectorAll('.co-chip').forEach(c=>c.addEventListener('click',()=>ask(c.dataset.q)));
$('coNew').addEventListener('click',()=>{history=[];apiMsgs=[];saveChat(history);renderHistory();});

// ── boot (auth guard) ──
(async()=>{
  function waitSupa(){return new Promise(res=>{(function w(){window.supabase?res():setTimeout(w,50);})();});}
  await waitSupa();
  try{
    const{data:{session}}=await client().auth.getSession();
    if(!session){window.location.href='login.html';return;}
    uid=session.user.id;
    localStorage.setItem('_dashUid',uid);
  }catch(e){window.location.href='login.html';return;}
  renderHistory();
})();
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
