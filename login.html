<!DOCTYPE html>
<html lang="en">
<head>

<script>(function(){var s=window.supabase;if(s&&s.createClient&&!s.__oneClient){s.__oneClient=true;var o=s.createClient.bind(s),c={};s.createClient=function(u,k,op){var q=String(u)+"|"+String(k);return c[q]||(c[q]=o(u,k,op));};}})();</script>
<link rel="preload" href="/v3/fonts/BricolageGrotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/v3/fonts/Onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/v3/app.css?v=2.9.4">
<style>
/* Login: one bright brand block + one white working card. Top-aligned on phones so the
   keyboard never covers the button; two columns from 900px. */
.auth {
  min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; gap:16px;
  max-width:440px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:calc(env(safe-area-inset-top, 0px) + 20px);
  padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 24px);
}
.brand { background:var(--todo); color:var(--on-todo); border-radius:var(--r-xl); padding:22px 22px 24px; display:flex; flex-direction:column; gap:14px; }
.brand .logo { width:56px; height:56px; border-radius:15px; box-shadow:0 4px 14px rgba(0,0,0,.18); display:block; }
.brand .mark svg { width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
.brand h1 { font-size:38px; line-height:1; font-weight:800; letter-spacing:-.02em; }
.brand p { font-size:16px; font-weight:500; opacity:.92; max-width:30ch; }
.brand .areas { display:flex; flex-wrap:wrap; gap:8px; }
.brand .areas span { font-size:13px; font-weight:700; padding:5px 11px; border-radius:999px; }
.areas .a-todo { background:color-mix(in srgb, var(--on-todo) 18%, transparent); }
.areas .a-gym { background:var(--gym); color:var(--on-gym); }
.areas .a-school { background:var(--school); color:var(--on-school); box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--on-todo) 35%, transparent); }
.areas .a-food { background:var(--food); color:var(--on-food); }

.auth-card { display:flex; flex-direction:column; gap:14px; padding:18px; border-radius:var(--r-xl); }
.auth-card .seg { display:grid; grid-template-columns:1fr 1fr; width:100%; }
.auth-card form { display:flex; flex-direction:column; gap:14px; }
.fld { display:flex; flex-direction:column; gap:6px; }
.pw { position:relative; }
.pw .text-in { padding-right:56px; }
.pw .eye { position:absolute; right:4px; top:4px; width:44px; height:44px; border-radius:999px; display:grid; place-items:center; color:var(--ink-3); }
.pw .eye svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.hint { font-size:13px; color:var(--ink-3); }
.msg { border-radius:14px; padding:12px 14px; font-size:15px; font-weight:600; line-height:1.4; display:flex; flex-direction:column; gap:8px; }
.msg.err { background:color-mix(in srgb, #FF4D6D 14%, var(--surface)); color:var(--ink); box-shadow:inset 3px 0 0 #E5384F; }
.msg.ok { background:var(--food-soft); color:var(--ink); }
.msg button { align-self:flex-start; min-height:40px; padding:0 14px; border-radius:999px; background:var(--surface-2); font-weight:700; font-size:14px; }
.go { min-height:52px; font-size:17px; }
.go[disabled] { opacity:.6; }
.foot { text-align:center; font-size:13px; color:var(--ink-3); }

@media (min-width: 900px) {
  .auth { max-width:960px; display:grid; grid-template-columns:1fr 1fr; align-items:center; align-content:center; gap:24px; padding-top:48px; }
  .brand { min-height:440px; justify-content:flex-end; padding:32px; }
  .brand h1 { font-size:56px; }
  .auth-card { padding:24px; }
  .foot { grid-column:1 / -1; }
}
</style>
</head>
<body>
<main class="auth">
  <section class="brand" aria-label="Dashboard">
    <img class="logo" src="/icon.svg?v=3" width="56" height="56" alt="">
    <h1>Dashboard</h1>
    <p>Your day at a glance: what to do, when to leave, what’s next.</p>
    <div class="areas" aria-hidden="true"><span class="a-todo">To-do</span><span class="a-gym">Gym</span><span class="a-school">School</span><span class="a-food">Food</span></div>
  </section>

  <section class="card auth-card" aria-labelledby="form-title">
    <h2 class="sr" id="form-title">Sign in or create an account</h2>
    <div class="seg" role="tablist" aria-label="Sign in or create account">
      <button role="tab" id="tab-in" type="button" aria-selected="true" data-tab="in">Sign in</button>
      <button role="tab" id="tab-up" type="button" aria-selected="false" data-tab="up">Create account</button>
    </div>

    <form id="auth-form" novalidate>
      <div class="fld" id="name-fld" hidden>
        <label class="field-label" for="name-in">Your name</label>
        <input class="text-in" id="name-in" name="name" autocomplete="given-name" maxlength="40" placeholder="What should we call you?">
      </div>
      <div class="fld">
        <label class="field-label" for="email-in">Email</label>
        <input class="text-in" id="email-in" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="you@example.com" required>
      </div>
      <div class="fld">
        <label class="field-label" for="pass-in">Password</label>
        <div class="pw">
          <input class="text-in" id="pass-in" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
          <button class="eye" id="eye" type="button" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path id="eye-p" d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/><path id="eye-x" d="M4 4l16 16" hidden/></svg>
          </button>
        </div>
        <p class="hint" id="pass-hint" hidden>At least 6 characters.</p>
      </div>
      <div id="msg" role="alert" aria-live="polite"></div>
      <button class="btn todo block go" id="go" type="submit">Sign in</button>
    </form>
  </section>

  <p class="foot" id="foot">You stay signed in on this device.</p>
</main>

<script>
(function () {
'use strict';
const SB_URL = 'https://mtuoqwbrujxutofhyahb.supabase.co';
const SB_KEY = 'sb_publishable_tYgBycEksvhfB-2sBenWHA_dLTeVO9F';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const RETIRED = ['health', 'habits', 'finance', 'projects', 'friends', 'trends'];
let tab = 'in', busy = false;

/* ---------- local data belongs to one account per device ----------
   localStorage is per browser, not per account. When a different account signs
   in on this device, wipe the previous owner's cached data (keep only the
   Supabase session) so it can never leak into or be pushed to the new account. */
function wipeLocalForNewOwner(userId) {
  try {
    const prevOwner = localStorage.getItem('_dashDataOwner');
    if (prevOwner === userId) return;
    const keep = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf('sb-') === 0) keep.push([k, localStorage.getItem(k)]);
    }
    localStorage.clear();
    keep.forEach(([k, v]) => { try { localStorage.setItem(k, v); } catch (e) {} });
  } catch (e) {}
  try { localStorage.setItem('_dashDataOwner', userId); } catch (e) {}
}

// Accounts from before sign-in existed kept their data under generic keys.
async function migrateIfNeeded(userId) {
  const OLD = ['dashboard', 'health', 'po-coach', 'school', 'habits', 'projects', 'settings'];
  try {
    const migKey = userId + ':_migrated';
    const { data: already } = await sb.from('app_state').select('key').eq('key', migKey).maybeSingle();
    if (already) return;
    for (const key of OLD) {
      const { data } = await sb.from('app_state').select('data').eq('key', key).maybeSingle();
      if (data && data.data) {
        await sb.from('app_state').upsert({ key: userId + ':' + key, data: data.data, updated_at: new Date().toISOString() }, { onConflict: 'key' });
        await sb.from('app_state').delete().eq('key', key);
      }
    }
    await sb.from('app_state').upsert({ key: migKey, data: { done: true, at: new Date().toISOString() }, updated_at: new Date().toISOString() }, { onConflict: 'key' });
  } catch (e) { console.warn('Migration (non-fatal):', e); }
}

async function setUpNewAccount(userId, name) {
  const now = new Date().toISOString();
  const pages = {}; RETIRED.forEach(k => { pages[k] = false; });
  const settings = { name: name, ui: 'v3', v3Archive: 1, pages: pages, setupDone: true, _pushAt: Date.now() };
  try { localStorage.setItem('dashboard:settings:v1', JSON.stringify(settings)); } catch (e) {}
  try {
    await sb.from('app_state').upsert([
      { key: userId + ':_migrated', data: { done: true, newUser: true, at: now }, updated_at: now },
      { key: userId + ':settings', data: settings, updated_at: now }
    ], { onConflict: 'key' });
  } catch (e) { console.warn('Setup (non-fatal):', e); }
}

async function enter(userId, isNew, name) {
  wipeLocalForNewOwner(userId);
  try { localStorage.setItem('_dashUid', userId); } catch (e) {}
  if (isNew) await setUpNewAccount(userId, name);
  else await migrateIfNeeded(userId);
  location.replace('/v3/');
}

/* ---------- UI ---------- */
function setTab(t) {
  tab = t;
  $('#tab-in').setAttribute('aria-selected', String(t === 'in'));
  $('#tab-up').setAttribute('aria-selected', String(t === 'up'));
  $('#name-fld').hidden = t !== 'up';
  $('#pass-hint').hidden = t !== 'up';
  $('#pass-in').autocomplete = t === 'up' ? 'new-password' : 'current-password';
  $('#pass-in').placeholder = t === 'up' ? 'Pick a password' : 'Your password';
  $('#go').textContent = t === 'up' ? 'Create account' : 'Sign in';
  $('#foot').textContent = t === 'up' ? 'No email to confirm. You’re in straight away.' : 'You stay signed in on this device.';
  say('');
}
function say(text, kind, action) {
  const el = $('#msg');
  if (!text) { el.className = ''; el.innerHTML = ''; return; }
  el.className = 'msg ' + (kind || 'err');
  el.textContent = text;
  if (action) {
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'msg-action'; b.textContent = action.label;
    b.addEventListener('click', action.run);
    el.appendChild(b);
  }
}
function setBusy(on, label) {
  busy = on;
  const b = $('#go');
  b.disabled = on;
  b.textContent = on ? label : (tab === 'up' ? 'Create account' : 'Sign in');
}

function friendly(error) {
  const m = String((error && (error.message || error.msg)) || '');
  const code = error && (error.code || error.error_code);
  if (code === 'invalid_credentials' || /invalid login credentials/i.test(m)) return 'That email and password don’t match. Check them and try again.';
  if (/fetch|network|load failed/i.test(m)) return 'Can’t connect right now. Check your internet and try again.';
  if (/rate limit|too many/i.test(m)) return 'Too many tries in a row. Wait a minute, then try again.';
  return 'Something went wrong signing in. Try again in a moment.';
}
async function callAccount(payload) {
  try {
    const r = await fetch('/api/account', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const j = await r.json().catch(() => ({}));
    return Object.assign({ ok: r.ok }, j);
  } catch (e) {
    return { ok: false, code: 'network', error: 'Can’t connect right now. Check your internet and try again.' };
  }
}

async function signIn(email, password) {
  setBusy(true, 'Signing in…');
  let { data, error } = await sb.auth.signInWithPassword({ email, password });
  // Older accounts that never confirmed their email: fix them on the spot.
  if (error && (error.code === 'email_not_confirmed' || /not confirmed/i.test(error.message || ''))) {
    const fix = await callAccount({ action: 'confirm', email, password });
    if (fix.ok) ({ data, error } = await sb.auth.signInWithPassword({ email, password }));
    else { setBusy(false); say(fix.error || friendly(error)); return; }
  }
  if (error) { setBusy(false); say(friendly(error)); return; }
  setBusy(true, 'Opening…');
  await enter(data.user.id, false);
}

async function signUp(name, email, password) {
  setBusy(true, 'Creating account…');
  const r = await callAccount({ action: 'signup', email, password, name });
  if (!r.ok) {
    setBusy(false);
    if (r.code === 'exists') say(r.error, 'err', { label: 'Sign in instead', run: () => { setTab('in'); $('#pass-in').focus(); } });
    else say(r.error || 'Couldn’t create the account. Try again in a minute.');
    return;
  }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { setBusy(false); setTab('in'); say('Your account is ready. Sign in with the same email and password.', 'ok'); return; }
  setBusy(true, 'Setting up…');
  await enter(data.user.id, true, name);
}

$('#auth-form').addEventListener('submit', e => {
  e.preventDefault();
  if (busy) return;
  const name = $('#name-in').value.trim();
  const email = $('#email-in').value.trim().toLowerCase();
  const password = $('#pass-in').value;
  if (tab === 'up' && !name) { say('Add your name first.'); $('#name-in').focus(); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { say('That doesn’t look like an email address.'); $('#email-in').focus(); return; }
  if (!password) { say('Enter your password.'); $('#pass-in').focus(); return; }
  if (tab === 'up' && password.length < 6) { say('Use a password with at least 6 characters.'); $('#pass-in').focus(); return; }
  say('');
  (tab === 'up' ? signUp(name, email, password) : signIn(email, password)).catch(err => { setBusy(false); say(friendly(err)); });
});
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#eye').addEventListener('click', () => {
  const p = $('#pass-in'), show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('#eye').setAttribute('aria-pressed', String(show));
  $('#eye').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  $('#eye-x').hidden = !show;
});

// Already signed in on this device: go straight in.
sb.auth.getSession().then(({ data }) => {
  const s = data && data.session;
  if (!s) return;
  wipeLocalForNewOwner(s.user.id);
  try { localStorage.setItem('_dashUid', s.user.id); } catch (e) {}
  location.replace('/v3/');
}).catch(() => {});
if (/[?&]signup\b/.test(location.search)) setTab('up');
})();
</script>
</body>
</html>
