<style>
:root {
  --bg: #050506;
  --bg-card: rgba(255, 255, 255, 0.04);
  --bg-secondary: rgba(255, 255, 255, 0.035);
  --bg-input: rgba(0, 0, 0, 0.28);
  --bg-input-focus: rgba(0, 0, 0, 0.36);

  --border: rgba(255, 255, 255, 0.06);
  --border-soft: rgba(255, 255, 255, 0.04);
  --border-strong: rgba(255, 255, 255, 0.12);

  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --text-quaternary: #4D4B47;

  --accent: #1D9E75;
  --accent-glow: rgba(29, 158, 117, 0.35);
  --warning: #FF8A4D;

  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text-secondary);
  font-family: var(--font);
  min-height: 100vh;
}
body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 28px 28px;
}
main {
  position: relative; z-index: 1;
  max-width: 720px;
  margin: 0 auto;
  padding: 56px 20px 120px;
}

.section-title {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin: 0 4px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-title::before {
  content: '≡';
  font-size: 14px;
  opacity: 0.5;
}

/* ── Today card ── */
.hb-today-card {
  background: var(--bg-card);
  border-radius: 16px;
  padding: 18px 18px 14px;
  margin-bottom: 16px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
}
.hb-habit-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-soft);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.hb-habit-row:last-of-type { border-bottom: none; }
.hb-check {
  width: 22px; height: 22px;
  border-radius: 6px;
  border: 2px solid rgba(255,255,255,0.15);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, border-color 0.15s;
}
.hb-check.done {
  border-color: transparent;
}
.hb-check.done::after {
  content: '✓';
  font-size: 13px;
  font-weight: 700;
  color: #fff;
}
.hb-habit-icon { font-size: 20px; line-height: 1; }
.hb-habit-name {
  flex: 1;
  font-size: 15px;
  color: var(--text-primary);
  font-weight: 500;
}
.hb-streak {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-tertiary);
  white-space: nowrap;
}
.hb-streak.hot { color: #f0a500; }

/* ── Edit button on custom habits ── */
.hb-edit-btn {
  background: none;
  border: none;
  color: var(--text-quaternary);
  font-size: 13px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 6px;
  flex-shrink: 0;
  line-height: 1;
}
.hb-edit-btn:active { opacity: 0.5; }
/* ── Edit modal ── */
.hb-modal {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.hb-modal.show { display: flex; }
.hb-modal-box {
  background: #111113;
  border: 1px solid var(--border-strong);
  border-radius: 20px;
  padding: 24px 20px 18px;
  width: min(320px, 90vw);
  box-shadow: 0 24px 64px rgba(0,0,0,0.7);
}
.hb-modal-title {
  font-size: 17px; font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 16px;
}
.hb-modal-row {
  display: flex; gap: 10px; margin-bottom: 16px;
}
.hb-emoji-pick {
  width: 50px; height: 44px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text-primary);
  font-size: 22px;
  text-align: center;
  font-family: var(--font);
  outline: none; flex-shrink: 0;
}
.hb-emoji-pick:focus { border-color: var(--accent); }
.hb-modal-name {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text-primary);
  font-size: 14px;
  padding: 8px 12px;
  font-family: var(--font);
  outline: none;
}
.hb-modal-name:focus { border-color: var(--accent); }
.hb-modal-actions { display: flex; gap: 8px; }
.hb-modal-del {
  flex: 1;
  background: rgba(220,60,60,0.12);
  border: 1px solid rgba(220,60,60,0.25);
  color: #e05252; border-radius: 9px;
  padding: 9px; font-size: 13px; cursor: pointer;
  font-family: var(--font);
}
.hb-modal-cancel {
  flex: 1;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  color: var(--text-secondary); border-radius: 9px;
  padding: 9px; font-size: 13px; cursor: pointer;
  font-family: var(--font);
}
.hb-modal-save {
  flex: 2;
  background: var(--accent);
  border: none; color: #fff; border-radius: 9px;
  padding: 9px; font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: var(--font);
}
/* ── Emoji input on add row ── */
.hb-emoji-add {
  width: 44px; height: 38px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text-primary);
  font-size: 18px;
  text-align: center;
  font-family: var(--font);
  outline: none; flex-shrink: 0;
}
.hb-emoji-add:focus { border-color: var(--accent); }
/* ── Add habit row ── */
.hb-add-row {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.hb-add-input {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text-primary);
  font-size: 14px;
  padding: 8px 12px;
  font-family: var(--font);
  outline: none;
}
.hb-add-input:focus { border-color: var(--accent); }
.hb-add-input::placeholder { color: var(--text-quaternary); }
.hb-add-btn {
  background: var(--accent);
  border: none;
  color: #fff;
  border-radius: 9px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
  white-space: nowrap;
}
.hb-add-btn:active { opacity: 0.8; }

/* ── Grid section ── */
.hb-grid-section {
  background: var(--bg-card);
  border-radius: 16px;
  padding: 18px 18px 14px;
  margin-bottom: 16px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
}
.hb-grid-habit {
  margin-bottom: 14px;
}
.hb-grid-habit:last-child { margin-bottom: 0; }
.hb-grid-label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 5px;
}
.hb-grid-label-icon { font-size: 14px; }
.hb-grid-label-name {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-tertiary);
  letter-spacing: 0.08em;
}
.hb-grid-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.hb-grid-scroll::-webkit-scrollbar { display: none; }
.hb-grid {
  display: flex;
  gap: 2px;
  /* 84 cells × (10px + 2px gap) = 1092px wide */
  width: max-content;
}
.hb-cell {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  background: rgba(255,255,255,0.06);
  flex-shrink: 0;
  cursor: pointer;
  transition: opacity 0.12s;
}
.hb-cell:active { opacity: 0.7; }
.hb-cell.done {
  /* color set inline per habit */
}
.hb-cell.today-cell {
  box-shadow: 0 0 0 1px rgba(255,255,255,0.3);
}

/* ═══ Habit rows ═══════════════════════════════════════════════════════════
   Each habit owns a colour (--hc). Undone = a dark card faintly tinted with it;
   done = the row FILLS with it. So the page is readable at a glance: colour is
   the state, not decoration. */
.hb-row {
  --hc: var(--accent, #a78bfa);
  display: flex; align-items: center; gap: 12px;
  padding: 12px 13px; margin-bottom: 10px; border-radius: 17px;
  background: color-mix(in srgb, var(--hc) 9%, rgba(255,255,255,0.02));
  border: 1px solid color-mix(in srgb, var(--hc) 20%, transparent);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.22s, border-color 0.22s, transform 0.12s;
}
.hb-row:active { transform: scale(0.985); }
.hb-row.done {
  background: var(--hc);
  border-color: var(--hc);
  box-shadow: 0 6px 20px -8px var(--hc);
}
.hb-ic {
  flex: 0 0 38px; width: 38px; height: 38px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; font-size: 19px;
  background: color-mix(in srgb, var(--hc) 20%, rgba(255,255,255,0.05));
}
.hb-row.done .hb-ic { background: rgba(255,255,255,0.22); }
.hb-txt { flex: 1; min-width: 0; }
.hb-nm {
  font-size: 15px; font-weight: 700; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hb-sub { font-size: 11.5px; color: var(--text-tertiary); margin-top: 1px; }
.hb-row.done .hb-nm { color: #fff; }
.hb-row.done .hb-sub { color: rgba(255,255,255,0.8); }
.hb-fire {
  font-size: 11.5px; font-weight: 800; color: var(--text-tertiary);
  flex-shrink: 0; font-variant-numeric: tabular-nums;
}
.hb-row.done .hb-fire { color: rgba(255,255,255,0.9); }
/* One big, always-in-the-same-place action button. */
.hb-btn {
  flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--hc) 45%, transparent);
  background: transparent; cursor: pointer; position: relative;
  -webkit-tap-highlight-color: transparent; transition: all 0.18s;
}
.hb-row.done .hb-btn { background: #fff; border-color: #fff; }
.hb-row.done .hb-btn::after {
  content: ''; position: absolute; left: 13px; top: 8px;
  width: 8px; height: 15px; border: solid var(--hc);
  border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
}
.hb-edit-btn { opacity: 0.35; }
.hb-row.done .hb-edit-btn { color: #fff; opacity: 0.7; }

/* ═══ Week strip ═══ */
.hb-week {
  display: flex; justify-content: space-between; gap: 2px;
  margin: 4px 0 20px; padding: 14px 8px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 18px;
}
.hb-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
.hb-dow { font-size: 10.5px; font-weight: 600; color: var(--text-tertiary); }
.hb-dot {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12.5px; font-weight: 700; color: var(--text-tertiary);
  background: rgba(255,255,255,0.05); position: relative; z-index: 1;
}
/* ring shows how much of the day you completed */
.hb-dot.part {
  background:
    conic-gradient(var(--accent) calc(var(--p) * 360deg), rgba(255,255,255,0.07) 0);
  color: var(--text-primary);
}
.hb-dot.full { background: var(--accent); color: #fff; box-shadow: 0 0 14px -3px var(--accent); }
.hb-dot.today { outline: 2px solid var(--accent); outline-offset: 2px; }
/* the line that literally joins consecutive perfect days */
.hb-day.link::before {
  content: ''; position: absolute; left: -50%; right: 50%; top: 36px; height: 2.5px;
  background: var(--accent); z-index: 0;
}

/* ═══ Record tiles ═══ */
.hb-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hb-stat {
  background: rgba(255,255,255,0.035); border: 1px solid var(--border);
  border-radius: 15px; padding: 13px 14px; position: relative;
}
.hb-stat-v { font-size: 22px; font-weight: 800; color: var(--text-primary); line-height: 1.1; }
.hb-stat-l {
  font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--text-tertiary); margin-top: 3px;
}
.hb-stat-i { position: absolute; top: 11px; right: 12px; font-size: 15px; opacity: 0.9; }

/* ═══ Partial progress fill ═══
   The colour bar IS the progress bar — a counted habit at 30/120 is 25% filled. */
.hb-row { position: relative; overflow: hidden; }
.hb-fill {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0;
  background: var(--hc); transition: width 0.35s cubic-bezier(.22,1,.36,1);
}
.hb-row.done .hb-fill { width: 100% !important; }
.hb-row-in { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; width: 100%; }
.hb-row.has-fill .hb-nm { color: #fff; }
.hb-row.has-fill .hb-sub { color: rgba(255,255,255,0.82); }
.hb-row.has-fill .hb-fire { color: rgba(255,255,255,0.9); }
.hb-btn.counted::after {
  content: '+'; position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; font-size: 20px; font-weight: 700;
  color: color-mix(in srgb, var(--hc) 80%, #fff);
}

/* ═══ Groups ═══ */
.hb-group { margin-bottom: 6px; }
.hb-group-h {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: none; border: none; cursor: pointer; padding: 6px 4px 8px;
  font-family: inherit; -webkit-tap-highlight-color: transparent;
}
.hb-group-nm { font-size: 13px; font-weight: 800; color: var(--text-primary); }
.hb-group-c {
  font-size: 10.5px; font-weight: 700; color: var(--text-tertiary);
  background: rgba(255,255,255,0.06); border-radius: 20px; padding: 2px 7px;
}
.hb-group-x { margin-left: auto; color: var(--text-tertiary); font-size: 15px; transition: transform 0.2s; }
.hb-group-x.c { transform: rotate(180deg); }
.hb-group-b { overflow: hidden; }
.hb-group-b.hide { display: none; }

/* ═══ Detail sheet ═══ */
.hb-sheet-bg {
  --hc: var(--accent, #a78bfa);
  position: fixed; inset: 0; z-index: 300; display: flex; align-items: flex-end;
  justify-content: center; background: rgba(0,0,0,0.65);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none; transition: opacity 0.22s;
}
.hb-sheet-bg.show { opacity: 1; pointer-events: auto; }
.hb-sheet {
  width: 100%; max-width: 460px; background: #16161c;
  border: 1px solid rgba(255,255,255,0.1); border-bottom: none;
  border-radius: 26px 26px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
  transform: translateY(14px); transition: transform 0.28s cubic-bezier(.22,1,.36,1);
  text-align: center;
}
.hb-sheet-bg.show .hb-sheet { transform: none; }
.hb-sheet-x {
  position: absolute; left: 20px; margin-top: 2px; width: 32px; height: 32px;
  border-radius: 50%; border: none; background: rgba(255,255,255,0.08);
  color: var(--text-secondary); font-size: 19px; cursor: pointer;
}
.hb-sheet-title { font-size: 20px; font-weight: 800; color: var(--text-primary); }
.hb-sheet-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 3px; }
.hb-ring-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 20px 0 8px; }
.hb-ring-wrap { position: relative; width: 168px; height: 168px; }
.hb-ring { width: 168px; height: 168px; transform: rotate(-90deg); }
.hb-ring-bg { fill: none; stroke: rgba(255,255,255,0.07); stroke-width: 10; }
.hb-ring-fg {
  fill: none; stroke: var(--hc); stroke-width: 10; stroke-linecap: round;
  stroke-dasharray: 327; stroke-dashoffset: 327;
  transition: stroke-dashoffset 0.45s cubic-bezier(.22,1,.36,1);
}
.hb-ring-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hb-ring-val { font-size: 46px; font-weight: 800; color: var(--text-primary); line-height: 1; font-variant-numeric: tabular-nums; }
.hb-ring-unit { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }
.hb-sheet-streak { position: absolute; top: 6px; right: -4px; font-size: 13px; font-weight: 800; color: #f0a500; }
.hb-step {
  width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
  border: none; background: color-mix(in srgb, var(--hc) 22%, transparent);
  color: #fff; font-size: 26px; font-weight: 700; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.hb-step:active { transform: scale(0.9); }
.hb-sheet-btns { display: flex; gap: 10px; margin-top: 16px; }
.hb-sheet-b {
  flex: 1; padding: 13px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.05); color: var(--text-secondary);
  font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
}
.hb-sheet-b.pri { background: var(--hc); border-color: var(--hc); color: #fff; }

/* ═══ Calendar ═══ */
.hb-cal {
  margin-top: 12px; padding: 14px 12px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 18px;
}
.hb-cal-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.hb-cal-t { font-size: 14px; font-weight: 800; color: var(--text-primary); }
.hb-cal-nav {
  width: 30px; height: 30px; border-radius: 9px; border: none;
  background: rgba(255,255,255,0.06); color: var(--text-secondary);
  font-size: 16px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.hb-cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px 0; }
.hb-cal-dow {
  font-size: 9.5px; font-weight: 700; color: var(--text-quaternary, var(--text-tertiary));
  text-align: center; padding-bottom: 5px;
}
.hb-cal-c { position: relative; display: flex; justify-content: center; }
.hb-cal-d {
  width: 30px; height: 30px; border-radius: 50%; position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 11.5px; font-weight: 600; color: var(--text-quaternary, var(--text-tertiary));
  background: rgba(255,255,255,0.04);
}
.hb-cal-d.part {
  background: conic-gradient(var(--accent) calc(var(--p) * 360deg), rgba(255,255,255,0.06) 0);
  color: var(--text-primary);
}
.hb-cal-d.full { background: var(--accent); color: #fff; }
.hb-cal-d.today { outline: 2px solid var(--accent); outline-offset: 1.5px; }
/* the same joined-streak idea as the week strip, but across the month */
.hb-cal-c.link::before {
  content: ''; position: absolute; top: 50%; margin-top: -1.25px;

<body>

<main>
  <!-- Week strip: consecutive perfect days are joined by a line, so a streak is

<!-- Habit detail: big ring, big number, − / + -->

</div>

<div class="hb-modal" id="hbEditModal">
  <div class="hb-modal-box">
    <div class="hb-modal-title" id="hbModalTitle">Edit Habit</div>
    <div class="hb-modal-row">
      <input class="hb-emoji-pick" id="hbEditEmoji" maxlength="2" placeholder="⭐">
      <input class="hb-modal-name" id="hbEditName" placeholder="Habit name" maxlength="40">

    </div>

<script>
(function(){
'use strict';

const SUPABASE_URL = 'https://mtuoqwbrujxutofhyahb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tYgBycEksvhfB-2sBenWHA_dLTeVO9F';
const APP_KEY_BASE = 'habits'; let APP_KEY = APP_KEY_BASE;

// ── in-memory store ──
let _db = {};
// Durable local mirror so nothing is lost on reload before the cloud push lands
const SYNC_LS='dashboard:sync:habits:v1';
let _localAt=0;
function persistLocal(){ try{ const b={}; Object.keys(_db).forEach(k=>{b[k]=_db[k];}); _localAt=Date.now(); b._localAt=_localAt; localStorage.setItem(SYNC_LS,JSON.stringify(b)); }catch(e){} }
function _mirrorAt(at){ try{ const b={}; Object.keys(_db).forEach(k=>{b[k]=_db[k];}); _localAt=at||_localAt; b._localAt=_localAt; localStorage.setItem(SYNC_LS,JSON.stringify(b)); }catch(e){} }
(function(){ try{ const b=JSON.parse(localStorage.getItem(SYNC_LS)); if(b&&typeof b==='object'){ Object.keys(b).forEach(k=>{ if(k!=='_localAt')_db[k]=b[k]; }); _localAt=b._localAt||0; } }catch(e){} })();
let schedulePush = function(){ persistLocal(); };  // persist locally even before cloud sync is ready
let _sb = null;
let lastRemoteAt = 0;
let pushTimer = null;

function client() {
  if (!_sb) _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  return _sb;
}

// ── defaults ──
// No Gym or Water here: the Fitness page already tracks workouts and Health already
// tracks water, so having them as habits too meant logging the same thing twice.
// Anyone who has customised their list keeps whatever they have — this only changes
// what a fresh account starts with, and no existing logs are touched.
const DEFAULT_HABITS = [
  {id:'study', name:'Study', icon:'📚', color:'#3498db'},
  {id:'sleep', name:'Sleep', icon:'😴', color:'#9b59b6'},
  {id:'read',  name:'Read',  icon:'📖', color:'#f39c12'},
];

function getHabits() {
  return _db['habits:list'] || DEFAULT_HABITS;
}
function getLog() {
  return _db['habits:log'] || {};
}

// ── Counted habits ─────────────────────────────────────────────────────────
// A habit is either SIMPLE (done / not done) or COUNTED (e.g. 30 of 120 minutes).
// Old log entries are the boolean `true`; counted ones store a number. Both stay
// valid — `true` reads as "target reached" — so no existing data needs migrating
// and nothing gets rewritten.
function hTarget(h) { return Math.max(1, parseInt(h.target, 10) || 1); }
function isCounted(h) { return hTarget(h) > 1; }
function hVal(h, day) {
  const v = (day || {})[h.id];
  if (v === true) return hTarget(h);
  return typeof v === 'number' ? v : 0;
}
function hDone(h, day) { return hVal(h, day) >= hTarget(h); }
function hPct(h, day) { return Math.min(1, hVal(h, day) / hTarget(h)); }
function hUnit(h) { return (h.unit || '').trim(); }
function hStep(h) { const t = hTarget(h); return t <= 10 ? 1 : (t <= 60 ? 5 : 10); }

// Single write path for both kinds, so XP and pruning behave identically.
function setVal(id, date, val) {
  const h = getHabits().find(x => x.id === id);
  if (!h) return;
  const log = getLog();
  const before = log[date] || {};
  const was = hDone(h, before);
  const day = Object.assign({}, before);
  const t = hTarget(h);
  const v = Math.max(0, Math.min(t, Math.round(val)));
  if (v <= 0) delete day[id];
  else day[id] = isCounted(h) ? v : true;

  const newLog = Object.assign({}, log);
  if (Object.keys(day).length === 0) delete newLog[date];
  else newLog[date] = day;
  _db['habits:log'] = newLog;

  if (!was && hDone(h, day) && window.dashAddXpDaily) {
    window.dashAddXpDaily(15, 'Completed a habit 🔥', 'habit:' + id + ':' + date);
  }
  schedulePush();
  renderAll();
}

// ── When: time of day ──────────────────────────────────────────────────────
// A habit is either pinned to a part of the day (Morning/Afternoon/Evening/Night)
// or to an exact time. An exact time wins and picks its own slot, so you never have
// to set both. Everything is optional — no slot means "Anytime".
const SLOTS = [
  ['morning',   'Morning',   '🌅'],
  ['afternoon', 'Afternoon', '☀️'],
  ['evening',   'Evening',   '🌆'],
  ['night',     'Night',     '🌙'],
  ['',          'Anytime',   '🕓'],
];
function slotOf(h) {
  if (h.at && /^\d{1,2}:\d{2}$/.test(h.at)) {
    const hh = parseInt(h.at.split(':')[0], 10);
    if (hh < 12) return 'morning';
    if (hh < 17) return 'afternoon';
    if (hh < 21) return 'evening';
    return 'night';
  }
  const w = String(h.when || '').toLowerCase();
  return ['morning', 'afternoon', 'evening', 'night'].indexOf(w) >= 0 ? w : '';
}
function slotMeta(key) { return SLOTS.find(s => s[0] === key) || SLOTS[SLOTS.length - 1]; }

// ── Groups ──
function collapsedGroups() {
  try { return JSON.parse(localStorage.getItem('habits:collapsed') || '{}'); } catch (e) { return {}; }
}
function toggleGroup(g) {
  const c = collapsedGroups();
  if (c[g]) delete c[g]; else c[g] = 1;
  try { localStorage.setItem('habits:collapsed', JSON.stringify(c)); } catch (e) {}
  renderToday();
}

// ── date helpers ──
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateOffset(daysAgo) {
  const d = new Date(); d.setDate(d.getDate() - daysAgo);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// streak = consecutive days the habit was COMPLETED (target reached), from today back
function calcStreak(habitId) {
  const h = getHabits().find(x => x.id === habitId);
  if (!h) return 0;
  const log = getLog();
  let streak = 0, offset = 1;
  if (hDone(h, log[today()] || {})) streak = 1;
  while (offset <= 365) {
    const dk = dateOffset(offset);
    if (hDone(h, log[dk] || {})) { streak++; offset++; }
    else break;
  }
  return streak;
}

// ── render today list ──
function renderToday() {
  const habits = getHabits();
  const log = getLog();
  const td = today();
  const todayLog = log[td] || {};
  const el = document.getElementById('habitList');
  if (!el) return;

  function rowHtml(h) {
    const done = hDone(h, todayLog);
    const pct = hPct(h, todayLog);
    const val = hVal(h, todayLog);
    const streak = calcStreak(h.id);
    const base = isCounted(h)
      ? `${val} / ${hTarget(h)}${hUnit(h) ? ' ' + hUnit(h) : ''}`
      : (done ? 'Done today' : 'Every day');
    const sub = h.at ? `${h.at} · ${base}` : base;
    return `<div class="hb-row${done ? ' done' : ''}${pct > 0 ? ' has-fill' : ''}"
        style="--hc:${h.color || '#a78bfa'}" data-id="${h.id}" data-date="${td}">
      <div class="hb-fill" style="width:${(pct * 100).toFixed(1)}%"></div>
      <div class="hb-row-in">
        <span class="hb-ic">${h.icon}</span>
        <div class="hb-txt">
          <div class="hb-nm">${h.name}</div>
          <div class="hb-sub">${sub}</div>
        </div>
        ${streak > 0 ? `<span class="hb-fire">🔥 ${streak}</span>` : ''}
        <button class="hb-edit-btn" data-edit="${h.id}" title="Edit">✎</button>
        <button class="hb-btn${isCounted(h) && !done ? ' counted' : ''}" data-act="${h.id}"
          aria-label="${done ? 'Undo' : 'Complete'} ${h.name}"></button>
      </div>
    </div>`;
  }

  // Grouped by time of day, in the order the day actually happens. Within a slot,
  // habits with an exact time come first, earliest first.
  const collapsed = collapsedGroups();
  el.innerHTML = SLOTS.map(([key, label, icon]) => {
    const list = habits.filter(h => slotOf(h) === key).sort((a, b) => {
      if (a.at && b.at) return a.at.localeCompare(b.at);
      if (a.at) return -1;
      if (b.at) return 1;
      return 0;
    });
    if (!list.length) return '';
    const doneN = list.filter(h => hDone(h, todayLog)).length;
    const isC = !!collapsed[key || 'anytime'];
    return `<div class="hb-group">
      <button class="hb-group-h" data-group="${key || 'anytime'}">
        <span class="hb-group-ic">${icon}</span>
        <span class="hb-group-nm">${label}</span>
        <span class="hb-group-c">${doneN}/${list.length}</span>
        <span class="hb-group-x${isC ? ' c' : ''}">⌃</span>
      </button>
      <div class="hb-group-b${isC ? ' hide' : ''}">${list.map(rowHtml).join('')}</div>
    </div>`;
  }).join('');

  el.querySelectorAll('.hb-group-h').forEach(b => {
    b.addEventListener('click', () => toggleGroup(b.getAttribute('data-group')));
  });
  el.querySelectorAll('.hb-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('.hb-edit-btn')) return;
      const id = row.getAttribute('data-id');
      const h = getHabits().find(x => x.id === id);
      // Counted habits open the detail sheet; simple ones just toggle.
      if (h && isCounted(h)) openSheet(id);
      else toggleHabit(id, row.getAttribute('data-date'));
    });
  });
  el.querySelectorAll('.hb-edit-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openEditModal(btn.getAttribute('data-edit'));
    });
  });

  renderWeek();
  renderStats();
  renderCalendar();
}

// How much of a given day was completed, 0–1 — partial progress counts.
function dayPct(dk) {
  const habits = getHabits();
  if (!habits.length) return 0;
  const day = getLog()[dk] || {};
  return habits.reduce((s, h) => s + hPct(h, day), 0) / habits.length;
}
function isPerfect(dk) {
  const habits = getHabits();
  if (!habits.length) return false;
  const day = getLog()[dk] || {};
  return habits.every(h => hDone(h, day));
}

// The week strip. A perfect day is a filled dot, and consecutive perfect days get
// joined by a line — so a streak is visible, not just a number.
function renderWeek() {
  const el = document.getElementById('hbWeek');
  if (!el) return;
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const dk = dateOffset(i);
    days.push({ dk, dow: DOW[d.getDay()], num: d.getDate(), pct: dayPct(dk), full: isPerfect(dk), today: i === 0 });
  }
  el.innerHTML = days.map((d, i) => {
    const full = d.full;
    const cls = full ? 'full' : (d.pct > 0 ? 'part' : '');
    // link back to the previous day only if BOTH are perfect
    const link = (i > 0 && full && days[i-1].full) ? ' link' : '';
    return `<div class="hb-day${link}">
      <span class="hb-dow">${d.dow}</span>
      <div class="hb-dot ${cls}${d.today?' today':''}" style="--p:${d.pct.toFixed(2)}">${d.num}</div>
    </div>`;
  }).join('');
}

function renderStats() {
  const el = document.getElementById('hbStats');
  if (!el) return;
  const habits = getHabits();
  const log = getLog();

  // best current streak across habits, and the best ever seen in the log
  let cur = 0, best = 0;
  habits.forEach(h => { cur = Math.max(cur, calcStreak(h.id)); });
  habits.forEach(h => {
    let run = 0;
    for (let i = 365; i >= 0; i--) {
      const dk = dateOffset(i);
      if (hDone(h, log[dk] || {})) { run++; best = Math.max(best, run); }
      else run = 0;
    }
  });

  // last 30 days: how many completions, and what share of the possible ones
  let done = 0, possible = 0;
  for (let i = 0; i < 30; i++) {
    const day = log[dateOffset(i)] || {};
    habits.forEach(h => { possible++; if (hDone(h, day)) done++; });
  }
  const rate = possible ? Math.round(done / possible * 100) : 0;

  const tiles = [
    [cur,  'Current streak', '🔥'],
    [best, 'Best streak',    '🏅'],
    [done, 'Completed · 30d','✅'],
    [rate + '%', 'Success rate', '🏁'],
  ];
  el.innerHTML = tiles.map(([v, l, i]) =>
    `<div class="hb-stat"><span class="hb-stat-i">${i}</span>
      <div class="hb-stat-v">${v}</div><div class="hb-stat-l">${l}</div></div>`).join('');
}

// ── Calendar: a month at a glance, with perfect days joined into visible streaks ──
let _calM = (function () { const d = new Date(); d.setDate(1); d.setHours(0, 0, 0, 0); return d; })();
function renderCalendar() {
  const el = document.getElementById('hbCal');
  if (!el) return;
  const y = _calM.getFullYear(), m = _calM.getMonth();
  const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const first = new Date(y, m, 1).getDay();          // 0 = Sunday
  const days = new Date(y, m + 1, 0).getDate();
  const td = today();

  const cells = [];
  for (let i = 0; i < first; i++) cells.push(null);  // lead-in blanks
  for (let d = 1; d <= days; d++) {
    const dk = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    cells.push({ d, dk, pct: dayPct(dk), full: isPerfect(dk), today: dk === td });
  }

  const html = cells.map((c, i) => {
    if (!c) return '<div class="hb-cal-c"></div>';
    const cls = c.full ? 'full' : (c.pct > 0 ? 'part' : '');
    // Join to the day on the left only when both are perfect AND on the same row.
    const prev = cells[i - 1];
    const sameRow = (i % 7) !== 0;
    const link = (c.full && prev && prev.full && sameRow) ? ' link' : '';
    return `<div class="hb-cal-c${link}">
      <div class="hb-cal-d ${cls}${c.today ? ' today' : ''}" style="--p:${c.pct.toFixed(2)}">${c.d}</div>
    </div>`;
  }).join('');

  el.innerHTML =
    `<div class="hb-cal-h">
       <button class="hb-cal-nav" id="hbCalPrev" aria-label="Previous month">‹</button>
       <span class="hb-cal-t">${MON[m]} ${y}</span>
       <button class="hb-cal-nav" id="hbCalNext" aria-label="Next month">›</button>
     </div>
     <div class="hb-cal-g">
       ${['S','M','T','W','T','F','S'].map(d => `<div class="hb-cal-dow">${d}</div>`).join('')}
       ${html}
     </div>`;

  document.getElementById('hbCalPrev').addEventListener('click', () => { _calM.setMonth(_calM.getMonth() - 1); renderCalendar(); });
  document.getElementById('hbCalNext').addEventListener('click', () => { _calM.setMonth(_calM.getMonth() + 1); renderCalendar(); });
}

// ── render contribution grids ──
function renderGrids() {
  const habits = getHabits();
  const log = getLog();
  const td = today();
  const el = document.getElementById('hbGridSection');
  if (!el) return;

  // 84 days: index 83=oldest, 0=today
  const DAYS = 84;

  el.innerHTML = habits.map(h => {
    let cells = '';
    for (let i = DAYS - 1; i >= 0; i--) {
      const dk = dateOffset(i);
      const done = log[dk] && log[dk][h.id];
      const isToday = dk === td;
      const bg = done ? h.color : '';
      const opacity = done ? '1' : '';
      cells += `<div class="hb-cell${done?' done':''}${isToday?' today-cell':''}"
        style="${done?`background:${h.color}`:''}${isToday&&!done?';box-shadow:0 0 0 1px rgba(255,255,255,0.3)':''}"
        data-id="${h.id}" data-date="${dk}" title="${dk}"></div>`;
    }
    return `<div class="hb-grid-habit">
      <div class="hb-grid-label">
        <span class="hb-grid-label-icon">${h.icon}</span>
        <span class="hb-grid-label-name">${h.name}</span>
      </div>
      <div class="hb-grid-scroll"><div class="hb-grid">${cells}</div></div>
    </div>`;
  }).join('');

  // event delegation for grid cells
  el.querySelectorAll('.hb-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      const id = cell.getAttribute('data-id');
      const date = cell.getAttribute('data-date');
      toggleHabit(id, date);
    });
  });

  // scroll grids to right (today)
  el.querySelectorAll('.hb-grid-scroll').forEach(s => { s.scrollLeft = s.scrollWidth; });
}

function renderAll() {
  renderToday();
  renderGrids();
}

// ── toggle a habit for a given date ──
function toggleHabit(id, date) {
  const h = getHabits().find(x => x.id === id);
  if (!h) return;
  const done = hDone(h, getLog()[date] || {});
  setVal(id, date, done ? 0 : hTarget(h));
}

// ── Detail sheet: big ring, big number, − / + ──
let _sheetId = null;
function openSheet(id) {
  const h = getHabits().find(x => x.id === id);
  if (!h) return;
  _sheetId = id;
  document.getElementById('hbSheet').classList.add('show');
  renderSheet();
}
function closeSheet() {
  _sheetId = null;
  document.getElementById('hbSheet').classList.remove('show');
}
function renderSheet() {
  const h = getHabits().find(x => x.id === _sheetId);
  if (!h) return;
  const day = getLog()[today()] || {};
  const val = hVal(h, day), t = hTarget(h), pct = hPct(h, day);
  const R = 327; // 2πr, r=52
  const s = document.getElementById('hbSheet');
  s.style.setProperty('--hc', h.color || '#a78bfa');
  document.getElementById('hbSheetTitle').textContent = h.icon + ' ' + h.name;
  document.getElementById('hbSheetSub').textContent =
    'Every day · ' + t + (hUnit(h) ? ' ' + hUnit(h) : '');
  document.getElementById('hbRingFg').style.strokeDashoffset = String(R * (1 - pct));
  document.getElementById('hbRingVal').textContent = String(val);
  document.getElementById('hbRingUnit').textContent = hUnit(h) || (t > 1 ? 'of ' + t : '');
  const st = document.getElementById('hbSheetStreak');
  const streak = calcStreak(h.id);
  st.textContent = streak > 0 ? '🔥 ' + streak : '';
}
function sheetStep(dir) {
  const h = getHabits().find(x => x.id === _sheetId);
  if (!h) return;
  const cur = hVal(h, getLog()[today()] || {});
  setVal(h.id, today(), cur + dir * hStep(h));
  renderSheet();
}

// ── add new habit ──
// Creating a habit now goes through the SAME modal as editing (see openEditModal),
// so you set when, how much and what colour up front rather than after the fact.

// ── Create / edit modal ──
let _editingId = null;
const HB_PALETTE = ['#e74c3c','#3498db','#9b59b6','#00bfff','#f39c12','#2ecc71',
                    '#e91e63','#f472b6','#14b8a6','#fbbf24','#8b5cf6','#fb7185'];
let _editColor = null;

let _editWhen = '';

// One modal for BOTH creating and editing — a new habit asks for when, how much and
// what colour up front, instead of making you create it and then go find the edit
// button to configure it.
function openEditModal(id) {
  const isNew = !id;
  const habit = isNew ? null : getHabits().find(h => h.id === id);
  if (!isNew && !habit) return;

  _editingId = id || null;
  _editWhen = habit ? slotOf(habit) : '';
  _editColor = habit ? (habit.color || '#a78bfa') : nextColor();

  document.getElementById('hbModalTitle').textContent = isNew ? 'New Habit' : 'Edit Habit';
  document.getElementById('hbEditEmoji').value = habit ? (habit.icon || '⭐') : '';
  document.getElementById('hbEditName').value = habit ? (habit.name || '') : '';
  document.getElementById('hbEditAt').value = habit ? (habit.at || '') : '';
  document.getElementById('hbEditTarget').value = habit ? hTarget(habit) : 1;
  document.getElementById('hbEditUnit').value = habit ? (habit.unit || '') : '';
  document.getElementById('hbEditDelete').style.display = isNew ? 'none' : '';

  paintWhen();
  paintColors();

  document.getElementById('hbEditModal').classList.add('show');
  document.getElementById('hbEditName').focus();
}

function nextColor() {
  const used = getHabits().map(h => h.color);
  return HB_PALETTE.find(c => used.indexOf(c) === -1) || HB_PALETTE[getHabits().length % HB_PALETTE.length];
}

function paintWhen() {
  const el = document.getElementById('hbWhenChips');
  el.innerHTML = SLOTS.map(([k, label, icon]) =>
    `<button type="button" class="hb-chip${k === _editWhen ? ' on' : ''}" data-w="${k}">${icon} ${label}</button>`).join('');
  el.querySelectorAll('.hb-chip').forEach(b => b.addEventListener('click', () => {
    _editWhen = b.getAttribute('data-w');
    document.getElementById('hbEditAt').value = ''; // a slot and an exact time are alternatives
    paintWhen();
    syncAtHint();
  }));
}
function paintColors() {
  const sw = document.getElementById('hbEditColors');
  sw.innerHTML = HB_PALETTE.map(c =>
    `<button type="button" data-c="${c}" class="${c === _editColor ? 'on' : ''}" style="background:${c}"></button>`).join('');
  sw.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    _editColor = b.getAttribute('data-c');
    paintColors();
  }));
}
// An exact time picks its own slot, so show which one it landed in.
function syncAtHint() {
  const at = document.getElementById('hbEditAt').value;
  const hint = document.getElementById('hbAtHint');
  if (at) {
    const m = slotMeta(slotOf({ at }));
    hint.textContent = '→ ' + m[2] + ' ' + m[1];
    _editWhen = '';
    document.getElementById('hbWhenChips').querySelectorAll('.hb-chip').forEach(c => c.classList.remove('on'));
  } else {
    hint.textContent = 'or set an exact time — optional';
  }
}
document.getElementById('hbEditCancel').addEventListener('click', () => {
  document.getElementById('hbEditModal').classList.remove('show');
});
document.getElementById('hbEditModal').addEventListener('click', e => {
  if (e.target.id === 'hbEditModal') document.getElementById('hbEditModal').classList.remove('show');
});
document.getElementById('hbEditAt').addEventListener('input', syncAtHint);

document.getElementById('hbEditSave').addEventListener('click', () => {
  const name = (document.getElementById('hbEditName').value || '').trim();
  if (!name) { document.getElementById('hbEditName').focus(); return; }
  const emoji = (document.getElementById('hbEditEmoji').value || '').trim() || '⭐';
  const target = Math.max(1, parseInt(document.getElementById('hbEditTarget').value, 10) || 1);
  const at = document.getElementById('hbEditAt').value || '';
  const fields = {
    icon: emoji,
    name: name,
    when: at ? '' : _editWhen,   // an exact time supersedes the slot
    at: at,
    target: target,
    unit: target > 1 ? (document.getElementById('hbEditUnit').value || '').trim() : '',
    color: _editColor || '#a78bfa',
  };

  const habits = getHabits().slice();
  if (_editingId) {
    const idx = habits.findIndex(h => h.id === _editingId);
    if (idx < 0) return;
    habits[idx] = Object.assign({}, habits[idx], fields);
  } else {
    habits.push(Object.assign({ id: 'custom_' + Date.now() }, fields));
  }
  _db['habits:list'] = habits;
  document.getElementById('hbEditModal').classList.remove('show');
  schedulePush();
  renderAll();
});

document.getElementById('hbNewBtn').addEventListener('click', () => openEditModal(null));

// ── Detail sheet wiring ──
document.getElementById('hbSheetX').addEventListener('click', closeSheet);
document.getElementById('hbSheet').addEventListener('click', e => { if (e.target.id === 'hbSheet') closeSheet(); });
document.getElementById('hbMinus').addEventListener('click', () => sheetStep(-1));
document.getElementById('hbPlus').addEventListener('click', () => sheetStep(1));
document.getElementById('hbSheetReset').addEventListener('click', () => {
  if (!_sheetId) return;
  setVal(_sheetId, today(), 0);
  renderSheet();
});
document.getElementById('hbSheetDone').addEventListener('click', () => {
  if (!_sheetId) return;
  const h = getHabits().find(x => x.id === _sheetId);
  setVal(_sheetId, today(), hTarget(h));
  renderSheet();
  setTimeout(closeSheet, 350);
});
document.getElementById('hbEditDelete').addEventListener('click', () => {
  if (!_editingId) return;
  const habits = getHabits().filter(h => h.id !== _editingId);
  _db['habits:list'] = habits;
  document.getElementById('hbEditModal').classList.remove('show');
  schedulePush();
  renderAll();
});

// ── Supabase sync ──
function applyRemote(data) {
  if (!data) return;
  const remoteAt = data._pushAt || 0;
  // Clock-free guard: skip only while a local save is mid-flight. Never compare
  // remoteAt to _localAt across devices — clock skew blocks incoming updates.
  if (pushTimer) return;
  // Merge (overlay remote), don't wipe — protects unpushed local keys.
  Object.keys(data).forEach(k => { if (k !== '_pushAt' && k !== '_localAt') _db[k] = data[k]; });
  _mirrorAt(remoteAt);
  renderAll();
}

async function doPush() {
  pushTimer = null;
  try{ await client().auth.getSession(); }catch(e){} // refresh token so a stale client's write doesn't silently fail
  // Merge with cloud first so another device's keys are never wiped.
  let cloud={};
  try{ const {data:row}=await client().from('app_state').select('data').eq('key',APP_KEY).maybeSingle(); if(row&&row.data&&typeof row.data==='object') cloud=row.data; }catch(e){}
  const data = Object.assign({}, cloud, _db, {_pushAt: Date.now()});
  delete data._localAt;
  client().from('app_state')
    .upsert({key: APP_KEY, data, updated_at: new Date().toISOString()}, {onConflict:'key'})
    .then(({error}) => {
      if (error) { console.warn('Habits push failed:', error); setTimeout(() => { schedulePush(); }, 5000); }
      else lastRemoteAt = data._pushAt;
    });
}

function realSchedulePush() {
  persistLocal();
  clearTimeout(pushTimer);
  pushTimer = setTimeout(doPush, 500);
}

function flushWithKeepalive() {
  if (!pushTimer) return;
  const data = Object.assign({}, _db, {_pushAt: Date.now()});
  try {
    fetch(`${SUPABASE_URL}/rest/v1/app_state`, {
      method: 'POST', keepalive: true,
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({key: APP_KEY, data, updated_at: new Date().toISOString()})
    });
  } catch(e) {}
}

async function initSync() {
  client(); // ensure _sb is created
  // Auth guard
  const { data: { session: _sess }, error: _authErr } = await _sb.auth.getSession();
  if (!_sess) { window.location.href = 'login.html'; return; }
  const _uid = _sess.user.id;
  localStorage.setItem('_dashUid', _uid);
  APP_KEY = _uid + ':' + APP_KEY_BASE;
  try {
    const {data: row} = await client().from('app_state').select('data').eq('key', APP_KEY).maybeSingle();
    const remoteAt = (row && row.data && row.data._pushAt) || 0;
    const hasRemote = !!(row && row.data && Object.keys(row.data).length > 0);
    schedulePush = realSchedulePush; // enable real pushes (retry works)
    if (hasRemote && remoteAt >= _localAt) {
      lastRemoteAt = remoteAt;
      applyRemote(row.data);
    } else if (Object.keys(_db).length > 0) {
      doPush(); // local (from durable mirror) is newer / cloud empty — push it up
    } else if (hasRemote) {
      lastRemoteAt = remoteAt;
      applyRemote(row.data);
    }
  } catch(e) { console.warn('Habits sync init failed:', e); schedulePush = realSchedulePush; }
  renderAll();
}

window.addEventListener('pagehide', flushWithKeepalive);
window.addEventListener('beforeunload', flushWithKeepalive);
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'hidden') { flushWithKeepalive(); return; }
  // pull on focus
  try {
    try{ await client().auth.getSession(); }catch(e){} // refresh token so a stale client doesn't silently return nothing
    const {data: row} = await client().from('app_state').select('data').eq('key', APP_KEY).maybeSingle();
    if (!row || !row.data) return;
    const remoteAt = row.data._pushAt || 0;
    if (remoteAt === lastRemoteAt) return;
    lastRemoteAt = remoteAt;
    applyRemote(row.data);
  } catch(e) {}
});

setInterval(async () => {
  if (!_sb || pushTimer) return;
  try {
    try{ await client().auth.getSession(); }catch(e){} // refresh token so a stale client doesn't silently return nothing
    const {data: row} = await client().from('app_state').select('data').eq('key', APP_KEY).maybeSingle();
    if (!row || !row.data) return;
    const remoteAt = row.data._pushAt || 0;
    if (remoteAt === lastRemoteAt) return;
    lastRemoteAt = remoteAt;
    applyRemote(row.data);
  } catch(e) {}
}, 5000);

function waitForSupabase() {
  if (window.supabase) initSync();
  else setTimeout(waitForSupabase, 50);
}

// initial render with defaults, then sync
renderAll();
waitForSupabase();

})();
</script>
