<style>
:root {
  --bg: #050506;
  --bg-card: rgba(255, 255, 255, 0.04);
  --bg-secondary: rgba(255, 255, 255, 0.035);
  --bg-input: rgba(0, 0, 0, 0.28);
  --bg-input-focus: rgba(0, 0, 0, 0.36);

  --border: rgba(255, 255, 255, 0.06);
  --border-soft: rgba(255, 255, 255, 0.04);
  --border-strong: rgba(255, 255, 255, 0.12);

  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --text-quaternary: #4D4B47;

  --accent: #1D9E75;
  --accent-glow: rgba(29, 158, 117, 0.35);
  --warning: #FF8A4D;

  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text-secondary);
  font-family: var(--font);
  min-height: 100vh;
}
body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 28px 28px;
}
main {
  position: relative; z-index: 1;
  max-width: 720px;
  margin: 0 auto;
  padding: 56px 20px 120px;
}

.section-title {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin: 0 4px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-title::before {
  content: '≡';
  font-size: 14px;
  opacity: 0.5;
}

/* ── Today card ── */
.hb-today-card {
  background: var(--bg-card);
  border-radius: 16px;
  padding: 18px 18px 14px;
  margin-bottom: 16px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
}
.hb-habit-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-soft);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.hb-habit-row:last-of-type { border-bottom: none; }
.hb-check {
  width: 22px; height: 22px;
  border-radius: 6px;
  border: 2px solid rgba(255,255,255,0.15);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, border-color 0.15s;
}
.hb-check.done {
  border-color: transparent;
}
.hb-check.done::after {
  content: '✓';
  font-size: 13px;
  font-weight: 700;
  color: #fff;
}
.hb-habit-icon { font-size: 20px; line-height: 1; }
.hb-habit-name {
  flex: 1;
  font-size: 15px;
  color: var(--text-primary);
  font-weight: 500;
}
.hb-streak {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-tertiary);
  white-space: nowrap;
}
.hb-streak.hot { color: #f0a500; }

/* ── Edit button on custom habits ── */
.hb-edit-btn {
  background: none;
  border: none;
  color: var(--text-quaternary);
  font-size: 13px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 6px;
  flex-shrink: 0;
  line-height: 1;
}
.hb-edit-btn:active { opacity: 0.5; }
/* ── Edit modal ── */
.hb-modal {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.hb-modal.show { display: flex; }
.hb-modal-box {
  background: #111113;
  border: 1px solid var(--border-strong);
  border-radius: 20px;
  padding: 24px 20px 18px;
  width: min(320px, 90vw);
  box-shadow: 0 24px 64px rgba(0,0,0,0.7);
}
.hb-modal-title {
  font-size: 17px; font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 16px;
}
.hb-modal-row {
  display: flex; gap: 10px; margin-bottom: 16px;
}
.hb-emoji-pick {
  width: 50px; height: 44px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text-primary);
  font-size: 22px;
  text-align: center;
  font-family: var(--font);
  outline: none; flex-shrink: 0;
}
.hb-emoji-pick:focus { border-color: var(--accent); }
.hb-modal-name {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text-primary);
  font-size: 14px;
  padding: 8px 12px;
  font-family: var(--font);
  outline: none;
}
.hb-modal-name:focus { border-color: var(--accent); }
.hb-modal-actions { display: flex; gap: 8px; }
.hb-modal-del {
  flex: 1;
  background: rgba(220,60,60,0.12);
  border: 1px solid rgba(220,60,60,0.25);
  color: #e05252; border-radius: 9px;
  padding: 9px; font-size: 13px; cursor: pointer;
  font-family: var(--font);
}
.hb-modal-cancel {
  flex: 1;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  color: var(--text-secondary); border-radius: 9px;
  padding: 9px; font-size: 13px; cursor: pointer;
  font-family: var(--font);
}
.hb-modal-save {
  flex: 2;
  background: var(--accent);
  border: none; color: #fff; border-radius: 9px;
  padding: 9px; font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: var(--font);
}
/* ── Emoji input on add row ── */
.hb-emoji-add {
  width: 44px; height: 38px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text-primary);
  font-size: 18px;
  text-align: center;
  font-family: var(--font);
  outline: none; flex-shrink: 0;
}
.hb-emoji-add:focus { border-color: var(--accent); }
/* ── Add habit row ── */
.hb-add-row {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.hb-add-input {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text-primary);
  font-size: 14px;
  padding: 8px 12px;
  font-family: var(--font);
  outline: none;
}
.hb-add-input:focus { border-color: var(--accent); }
.hb-add-input::placeholder { color: var(--text-quaternary); }
.hb-add-btn {
  background: var(--accent);
  border: none;
  color: #fff;
  border-radius: 9px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
  white-space: nowrap;
}
.hb-add-btn:active { opacity: 0.8; }

/* ── Grid section ── */
.hb-grid-section {
  background: var(--bg-card);
  border-radius: 16px;
  padding: 18px 18px 14px;
  margin-bottom: 16px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
}
.hb-grid-habit {
  margin-bottom: 14px;
}
.hb-grid-habit:last-child { margin-bottom: 0; }
.hb-grid-label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 5px;
}
.hb-grid-label-icon { font-size: 14px; }
.hb-grid-label-name {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-tertiary);
  letter-spacing: 0.08em;
}
.hb-grid-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.hb-grid-scroll::-webkit-scrollbar { display: none; }
.hb-grid {
  display: flex;
  gap: 2px;
  /* 84 cells × (10px + 2px gap) = 1092px wide */
  width: max-content;
}
.hb-cell {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  background: rgba(255,255,255,0.06);
  flex-shrink: 0;
  cursor: pointer;
  transition: opacity 0.12s;
}
.hb-cell:active { opacity: 0.7; }
.hb-cell.done {
  /* color set inline per habit */
}
.hb-cell.today-cell {
  box-shadow: 0 0 0 1px rgba(255,255,255,0.3);
}

/* ═══ Habit rows ═══════════════════════════════════════════════════════════
   Each habit owns a colour (--hc). Undone = a dark card faintly tinted with it;
   done = the row FILLS with it. So the page is readable at a glance: colour is
   the state, not decoration. */
.hb-row {
  --hc: var(--accent, #a78bfa);
  display: flex; align-items: center; gap: 12px;
  padding: 12px 13px; margin-bottom: 10px; border-radius: 17px;
  background: color-mix(in srgb, var(--hc) 9%, rgba(255,255,255,0.02));
  border: 1px solid color-mix(in srgb, var(--hc) 20%, transparent);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.22s, border-color 0.22s, transform 0.12s;
}
.hb-row:active { transform: scale(0.985); }
.hb-row.done {
  background: var(--hc);
  border-color: var(--hc);
  box-shadow: 0 6px 20px -8px var(--hc);
}
.hb-ic {
  flex: 0 0 38px; width: 38px; height: 38px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; font-size: 19px;
  background: color-mix(in srgb, var(--hc) 20%, rgba(255,255,255,0.05));
}
.hb-row.done .hb-ic { background: rgba(255,255,255,0.22); }
.hb-txt { flex: 1; min-width: 0; }
.hb-nm {
  font-size: 15px; font-weight: 700; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hb-sub { font-size: 11.5px; color: var(--text-tertiary); margin-top: 1px; }
.hb-row.done .hb-nm { color: #fff; }
.hb-row.done .hb-sub { color: rgba(255,255,255,0.8); }
.hb-fire {
  font-size: 11.5px; font-weight: 800; color: var(--text-tertiary);
  flex-shrink: 0; font-variant-numeric: tabular-nums;
}
.hb-row.done .hb-fire { color: rgba(255,255,255,0.9); }
/* One big, always-in-the-same-place action button. */
.hb-btn {
  flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--hc) 45%, transparent);
  background: transparent; cursor: pointer; position: relative;
  -webkit-tap-highlight-color: transparent; transition: all 0.18s;
}
.hb-row.done .hb-btn { background: #fff; border-color: #fff; }
.hb-row.done .hb-btn::after {
  content: ''; position: absolute; left: 13px; top: 8px;
  width: 8px; height: 15px; border: solid var(--hc);
  border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
}
.hb-edit-btn { opacity: 0.35; }
.hb-row.done .hb-edit-btn { color: #fff; opacity: 0.7; }

/* ═══ Week strip ═══ */
.hb-week {
  display: flex; justify-content: space-between; gap: 2px;
  margin: 4px 0 20px; padding: 14px 8px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 18px;
}
.hb-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
.hb-dow { font-size: 10.5px; font-weight: 600; color: var(--text-tertiary); }
.hb-dot {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12.5px; font-weight: 700; color: var(--text-tertiary);
  background: rgba(255,255,255,0.05); position: relative; z-index: 1;
}
/* ring shows how much of the day you completed */
.hb-dot.part {
  background:
    conic-gradient(var(--accent) calc(var(--p) * 360deg), rgba(255,255,255,0.07) 0);
  color: var(--text-primary);
}
.hb-dot.full { background: var(--accent); color: #fff; box-shadow: 0 0 14px -3px var(--accent); }
.hb-dot.today { outline: 2px solid var(--accent); outline-offset: 2px; }
/* the line that literally joins consecutive perfect days */
.hb-day.link::before {
  content: ''; position: absolute; left: -50%; right: 50%; top: 36px; height: 2.5px;
  background: var(--accent); z-index: 0;
}

/* ═══ Record tiles ═══ */
.hb-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hb-stat {
  background: rgba(255,255,255,0.035); border: 1px solid var(--border);
  border-radius: 15px; padding: 13px 14px; position: relative;
}
.hb-stat-v { font-size: 22px; font-weight: 800; color: var(--text-primary); line-height: 1.1; }
.hb-stat-l {
  font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--text-tertiary); margin-top: 3px;
}
.hb-stat-i { position: absolute; top: 11px; right: 12px; font-size: 15px; opacity: 0.9; }
</style>

<script>
(function(){
'use strict';

const SUPABASE_URL = 'https://mtuoqwbrujxutofhyahb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tYgBycEksvhfB-2sBenWHA_dLTeVO9F';

// ── in-memory store ──
let _db = {};

const SYNC_LS='dashboard:sync:habits:v1';
let _localAt=0;
function persistLocal(){ try{ const b={}; Object.keys(_db).forEach(k=>{b[k]=_db[k];}); _localAt=Date.now(); b._localAt=_localAt; localStorage.setItem(SYNC_LS,JSON.stringify(b)); }catch(e){} }
function _mirrorAt(at){ try{ const b={}; Object.keys(_db).forEach(k=>{b[k]=_db[k];}); _localAt=at||_localAt; b._localAt=_localAt; localStorage.setItem(SYNC_LS,JSON.stringify(b)); }catch(e){} }
(function(){ try{ const b=JSON.parse(localStorage.getItem(SYNC_LS)); if(b&&typeof b==='object'){ Object.keys(b).forEach(k=>{ if(k!=='_localAt')_db[k]=b[k]; }); _localAt=b._localAt||0; } }catch(e){} })();
let schedulePush = function(){ persistLocal(); };  // persist locally even before cloud sync is ready

function client() {

}

// ── defaults ──
const DEFAULT_HABITS = [
  {id:'gym',   name:'Gym',   icon:'💪', color:'#e74c3c'},
  {id:'study', name:'Study', icon:'📚', color:'#3498db'},
  {id:'sleep', name:'Sleep', icon:'😴', color:'#9b59b6'},
  {id:'water', name:'Water', icon:'💧', color:'#00bfff'},
  {id:'read',  name:'Read',  icon:'📖', color:'#f39c12'},
];

function getHabits() {
  return _db['habits:list'] || DEFAULT_HABITS;
}
function getLog() {
  return _db['habits:log'] || {};
}

// ── date helpers ──
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateOffset(daysAgo) {
  const d = new Date(); d.setDate(d.getDate() - daysAgo);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// streak = consecutive days where habit was done, going backwards from today
function calcStreak(habitId) {
  const log = getLog();
  const td = today();
  // start from today if done, else from yesterday
  let streak = 0;
  let offset = 0;
  if (log[td] && log[td][habitId]) { streak = 1; offset = 1; }
  else { offset = 1; }
  while (true) {
    const dk = dateOffset(offset);
    if (log[dk] && log[dk][habitId]) { streak++; offset++; }
    else break;
    if (offset > 365) break;
  }
  return streak;
}

// ── render today list ──
function renderToday() {
  const habits = getHabits();
  const log = getLog();
  const td = today();
  const todayLog = log[td] || {};
  const el = document.getElementById('habitList');
  if (!el) return;

  el.innerHTML = habits.map(h => {
    const done = !!todayLog[h.id];
    const streak = calcStreak(h.id);
    const isCustom = h.id.startsWith('custom_');
    const editBtn = isCustom ? `<button class="hb-edit-btn" data-edit="${h.id}" title="Edit">✎</button>` : '';
    return `<div class="hb-row${done?' done':''}" style="--hc:${h.color||'#a78bfa'}" data-id="${h.id}" data-date="${td}">
      <span class="hb-ic">${h.icon}</span>
      <div class="hb-txt">
        <div class="hb-nm">${h.name}</div>
        <div class="hb-sub">${done ? 'Done today' : 'Every day'}</div>
      </div>
      ${streak > 0 ? `<span class="hb-fire">🔥 ${streak}</span>` : ''}
      ${editBtn}
      <button class="hb-btn" aria-label="${done?'Undo':'Complete'} ${h.name}"></button>
    </div>`;
  }).join('');

  el.querySelectorAll('.hb-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('.hb-edit-btn')) return;
      toggleHabit(row.getAttribute('data-id'), row.getAttribute('data-date'));
    });
  });
  el.querySelectorAll('.hb-edit-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openEditModal(btn.getAttribute('data-edit'));
    });
  });

  renderWeek();
  renderStats();
}

// How much of a given day was completed, 0–1.
function dayPct(dk) {
  const habits = getHabits();
  if (!habits.length) return 0;
  const day = getLog()[dk] || {};
  return habits.filter(h => day[h.id]).length / habits.length;
}

// The week strip. A perfect day is a filled dot, and consecutive perfect days get
// joined by a line — so a streak is visible, not just a number.
function renderWeek() {
  const el = document.getElementById('hbWeek');
  if (!el) return;
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const dk = dateOffset(i);
    days.push({ dk, dow: DOW[d.getDay()], num: d.getDate(), pct: dayPct(dk), today: i === 0 });
  }
  el.innerHTML = days.map((d, i) => {
    const full = d.pct >= 1 && d.pct > 0;
    const cls = full ? 'full' : (d.pct > 0 ? 'part' : '');
    // link back to the previous day only if BOTH are perfect
    const link = (i > 0 && full && days[i-1].pct >= 1 && days[i-1].pct > 0) ? ' link' : '';
    return `<div class="hb-day${link}">
      <span class="hb-dow">${d.dow}</span>
      <div class="hb-dot ${cls}${d.today?' today':''}" style="--p:${d.pct.toFixed(2)}">${d.num}</div>
    </div>`;
  }).join('');
}

function renderStats() {
  const el = document.getElementById('hbStats');
  if (!el) return;
  const habits = getHabits();
  const log = getLog();

  // best current streak across habits, and the best ever seen in the log
  let cur = 0, best = 0;
  habits.forEach(h => { cur = Math.max(cur, calcStreak(h.id)); });
  habits.forEach(h => {
    let run = 0;
    for (let i = 365; i >= 0; i--) {
      const dk = dateOffset(i);
      if (log[dk] && log[dk][h.id]) { run++; best = Math.max(best, run); }
      else run = 0;
    }
  });

  // last 30 days: how many ticks, and what share of the possible ones
  let done = 0, possible = 0;
  for (let i = 0; i < 30; i++) {
    const day = log[dateOffset(i)] || {};
    habits.forEach(h => { possible++; if (day[h.id]) done++; });
  }
  const rate = possible ? Math.round(done / possible * 100) : 0;

  const tiles = [
    [cur,  'Current streak', '🔥'],
    [best, 'Best streak',    '🏅'],
    [done, 'Completed · 30d','✅'],
    [rate + '%', 'Success rate', '🏁'],
  ];
  el.innerHTML = tiles.map(([v, l, i]) =>
    `<div class="hb-stat"><span class="hb-stat-i">${i}</span>
      <div class="hb-stat-v">${v}</div><div class="hb-stat-l">${l}</div></div>`).join('');
}

// ── render contribution grids ──
function renderGrids() {
  const habits = getHabits();
  const log = getLog();
  const td = today();
  const el = document.getElementById('hbGridSection');
  if (!el) return;

  // 84 days: index 83=oldest, 0=today
  const DAYS = 84;

  el.innerHTML = habits.map(h => {
    let cells = '';
    for (let i = DAYS - 1; i >= 0; i--) {
      const dk = dateOffset(i);
      const done = log[dk] && log[dk][h.id];
      const isToday = dk === td;
      const bg = done ? h.color : '';
      const opacity = done ? '1' : '';
      cells += `<div class="hb-cell${done?' done':''}${isToday?' today-cell':''}"
        style="${done?`background:${h.color}`:''}${isToday&&!done?';box-shadow:0 0 0 1px rgba(255,255,255,0.3)':''}"
        data-id="${h.id}" data-date="${dk}" title="${dk}"></div>`;
    }
    return `<div class="hb-grid-habit">
      <div class="hb-grid-label">
        <span class="hb-grid-label-icon">${h.icon}</span>
        <span class="hb-grid-label-name">${h.name}</span>
      </div>
      <div class="hb-grid-scroll"><div class="hb-grid">${cells}</div></div>
    </div>`;
  }).join('');

  // event delegation for grid cells
  el.querySelectorAll('.hb-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      const id = cell.getAttribute('data-id');
      const date = cell.getAttribute('data-date');
      toggleHabit(id, date);
    });
  });

  // scroll grids to right (today)
  el.querySelectorAll('.hb-grid-scroll').forEach(s => { s.scrollLeft = s.scrollWidth; });
}

function renderAll() {
  renderToday();
  renderGrids();
}

// ── toggle a habit for a given date ──
function toggleHabit(id, date) {
  const log = getLog();
  const dayLog = Object.assign({}, log[date] || {});
  dayLog[id] = !dayLog[id];
  if (dayLog[id] && window.dashAddXpDaily) window.dashAddXpDaily(15, 'Completed a habit 🔥', 'habit:' + id + ':' + date);
  if (!dayLog[id]) delete dayLog[id];
  const newLog = Object.assign({}, log);
  if (Object.keys(dayLog).length === 0) delete newLog[date];
  else newLog[date] = dayLog;
  _db['habits:log'] = newLog;
  schedulePush();
  renderAll();
}

// ── add new habit ──
document.getElementById('hbAddBtn').addEventListener('click', addHabit);
document.getElementById('hbAddInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addHabit();
});
function addHabit() {
  const inp = document.getElementById('hbAddInput');
  const emojiInp = document.getElementById('hbEmojiInput');
  const name = (inp.value || '').trim();
  if (!name) return;
  const icon = (emojiInp.value || '').trim() || '⭐';
  const habits = getHabits().slice();
  const id = 'custom_' + Date.now();
  // Every new habit used to get the SAME green, which is why the list read as one
  // undifferentiated block. Hand out the next unused colour instead.
  const PALETTE = ['#e74c3c','#3498db','#9b59b6','#00bfff','#f39c12','#2ecc71',
                   '#e91e63','#f472b6','#14b8a6','#fbbf24','#8b5cf6','#fb7185'];
  const used = habits.map(h => h.color);
  const color = PALETTE.find(c => used.indexOf(c) === -1) || PALETTE[habits.length % PALETTE.length];
  habits.push({id, name, icon, color});
  _db['habits:list'] = habits;
  inp.value = '';
  emojiInp.value = '';
  schedulePush();
  renderAll();
}

// ── Edit modal for custom habits ──
let _editingId = null;
function openEditModal(id) {
  const habit = getHabits().find(h => h.id === id);
  if (!habit) return;
  _editingId = id;
  document.getElementById('hbEditEmoji').value = habit.icon || '⭐';
  document.getElementById('hbEditName').value = habit.name || '';
  document.getElementById('hbEditModal').classList.add('show');
  document.getElementById('hbEditName').focus();
}
document.getElementById('hbEditCancel').addEventListener('click', () => {
  document.getElementById('hbEditModal').classList.remove('show');
});
document.getElementById('hbEditModal').addEventListener('click', e => {
  if (e.target.id === 'hbEditModal') document.getElementById('hbEditModal').classList.remove('show');
});
document.getElementById('hbEditSave').addEventListener('click', () => {
  if (!_editingId) return;
  const emoji = (document.getElementById('hbEditEmoji').value || '').trim() || '⭐';
  const name = (document.getElementById('hbEditName').value || '').trim();
  if (!name) return;
  const habits = getHabits().slice();
  const idx = habits.findIndex(h => h.id === _editingId);
  if (idx < 0) return;
  habits[idx] = {...habits[idx], icon: emoji, name};
  _db['habits:list'] = habits;
  document.getElementById('hbEditModal').classList.remove('show');
  schedulePush();
  renderAll();
});
document.getElementById('hbEditDelete').addEventListener('click', () => {
  if (!_editingId) return;
  const habits = getHabits().filter(h => h.id !== _editingId);
  _db['habits:list'] = habits;
  document.getElementById('hbEditModal').classList.remove('show');
  schedulePush();
  renderAll();
});

// ── Supabase sync ──
function applyRemote(data) {
  if (!data) return;
  const remoteAt = data._pushAt || 0;
  // Clock-free guard: skip only while a local save is mid-flight. Never compare
  // remoteAt to _localAt across devices — clock skew blocks incoming updates.
  if (pushTimer) return;
  // Merge (overlay remote), don't wipe — protects unpushed local keys.
  Object.keys(data).forEach(k => { if (k !== '_pushAt' && k !== '_localAt') _db[k] = data[k]; });
  _mirrorAt(remoteAt);
  renderAll();
}

async function doPush() {
  pushTimer = null;
  try{ await client().auth.getSession(); }catch(e){} // refresh token so a stale client's write doesn't silently fail
  // Merge with cloud first so another device's keys are never wiped.
  let cloud={};
  try{ const {data:row}=await client().from('app_state').select('data').eq('key',APP_KEY).maybeSingle(); if(row&&row.data&&typeof row.data==='object') cloud=row.data; }catch(e){}
  const data = Object.assign({}, cloud, _db, {_pushAt: Date.now()});
  delete data._localAt;
  client().from('app_state')
    .upsert({key: APP_KEY, data, updated_at: new Date().toISOString()}, {onConflict:'key'})
    .then(({error}) => {
      if (error) { console.warn('Habits push failed:', error); setTimeout(() => { schedulePush(); }, 5000); }
      else lastRemoteAt = data._pushAt;
    });
}

function realSchedulePush() {
  persistLocal();
  clearTimeout(pushTimer);
  pushTimer = setTimeout(doPush, 500);
}

function flushWithKeepalive() {
  if (!pushTimer) return;
  const data = Object.assign({}, _db, {_pushAt: Date.now()});
  try {
    fetch(`${SUPABASE_URL}/rest/v1/app_state`, {
      method: 'POST', keepalive: true,
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({key: APP_KEY, data, updated_at: new Date().toISOString()})
    });
  } catch(e) {}
}

async function initSync() {
  client(); // ensure _sb is created
  // Auth guard
  const { data: { session: _sess }, error: _authErr } = await _sb.auth.getSession();
  if (!_sess) { window.location.href = 'login.html'; return; }
  const _uid = _sess.user.id;
  localStorage.setItem('_dashUid', _uid);
  APP_KEY = _uid + ':' + APP_KEY_BASE;
  try {
    const {data: row} = await client().from('app_state').select('data').eq('key', APP_KEY).maybeSingle();
    const remoteAt = (row && row.data && row.data._pushAt) || 0;
    const hasRemote = !!(row && row.data && Object.keys(row.data).length > 0);
    schedulePush = realSchedulePush; // enable real pushes (retry works)
    if (hasRemote && remoteAt >= _localAt) {
      lastRemoteAt = remoteAt;
      applyRemote(row.data);
    } else if (Object.keys(_db).length > 0) {
      doPush(); // local (from durable mirror) is newer / cloud empty — push it up
    } else if (hasRemote) {
      lastRemoteAt = remoteAt;
      applyRemote(row.data);
    }
  } catch(e) { console.warn('Habits sync init failed:', e); schedulePush = realSchedulePush; }
  renderAll();
}

window.addEventListener('pagehide', flushWithKeepalive);
window.addEventListener('beforeunload', flushWithKeepalive);
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'hidden') { flushWithKeepalive(); return; }
  // pull on focus
  try {
    try{ await client().auth.getSession(); }catch(e){} // refresh token so a stale client doesn't silently return nothing
    const {data: row} = await client().from('app_state').select('data').eq('key', APP_KEY).maybeSingle();
    if (!row || !row.data) return;
    const remoteAt = row.data._pushAt || 0;
    if (remoteAt === lastRemoteAt) return;
    lastRemoteAt = remoteAt;
    applyRemote(row.data);
  } catch(e) {}
});

setInterval(async () => {
  if (!_sb || pushTimer) return;
  try {
    try{ await client().auth.getSession(); }catch(e){} // refresh token so a stale client doesn't silently return nothing
    const {data: row} = await client().from('app_state').select('data').eq('key', APP_KEY).maybeSingle();
    if (!row || !row.data) return;
    const remoteAt = row.data._pushAt || 0;
    if (remoteAt === lastRemoteAt) return;
    lastRemoteAt = remoteAt;
    applyRemote(row.data);
  } catch(e) {}
}, 5000);

function waitForSupabase() {
  if (window.supabase) initSync();
  else setTimeout(waitForSupabase, 50);
}

// initial render with defaults, then sync
renderAll();
waitForSupabase();

})();
</script>
